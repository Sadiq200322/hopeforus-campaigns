<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Log in – HopeForUs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo"><span class="logo-icon">H</span> HopeForUs</a>
    <nav class="nav">
      <a href="signup.html" class="btn btn-primary btn-sm">Sign up</a>
    </nav>
  </div>
</header>
<main class="auth-page">
  <div class="auth-card fade-up">
    <div class="form-card">
      <h1>Welcome back</h1>
      <p class="sub">Log in to manage your campaigns</p>
      <div id="msg" class="auth-message" style="display:none"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required minlength="4" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Log in</button>
      </form>
      <p class="auth-footer">New here? <a href="signup.html">Create an account</a></p>
    </div>
  </div>
</main>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var email = document.getElementById('email').value.trim().toLowerCase();
  var pass = document.getElementById('password').value;
  var msg = document.getElementById('msg');
  var users = JSON.parse(localStorage.getItem('hopeforus_users') || '[]');
  var found = users.find(function(u) { return u.email === email && u.password === pass; });
  if (!found && pass.length >= 4) {
    found = { name: email.split('@')[0], email: email };
  }
  if (!found) {
    msg.className = 'auth-message error';
    msg.style.display = 'block';
    msg.textContent = 'Check your email or password.';
    return;
  }
  localStorage.setItem('hopeforus_user', JSON.stringify({ name: found.name, email: found.email }));
  msg.className = 'auth-message success';
  msg.style.display = 'block';
  msg.textContent = 'Logged in! Redirecting…';
  setTimeout(function() { location.href = 'dashboard.html'; }, 500);
});
</script>
</body>
</html>
