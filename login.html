<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Log in – HopeForUs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,sans-serif;background:#f7f7f7;min-height:100vh;display:flex;flex-direction:column;color:#1a1a1a}
.top{padding:16px 20px;background:#fff;border-bottom:1px solid #eee;text-align:center}
.top a{font-weight:800;text-decoration:none;color:#1a1a1a;display:inline-flex;align-items:center;gap:8px}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
h1{font-size:1.5rem;font-weight:800;margin-bottom:6px}
.sub{color:#5c5c5c;font-size:.95rem;margin-bottom:22px}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px}
input{width:100%;padding:14px;border:1.5px solid #e0e0e0;border-radius:12px;font-size:1rem;font-family:inherit;margin-bottom:14px}
input:focus{outline:none;border-color:#02a95c}
.btn{width:100%;padding:14px;border:none;border-radius:999px;background:#02a95c;color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
.err{color:#c0392b;font-size:.85rem;margin-bottom:10px;display:none}
.foot{text-align:center;margin-top:18px;font-size:.9rem;color:#5c5c5c}
.foot a{color:#02a95c;font-weight:600;text-decoration:none}
.admin{margin-top:12px;font-size:.8rem;color:#888;text-align:center}
</style>
</head>
<body>
<div class="top"><a href="index.html"><img src="logo-mark.svg" width="28" height="28" alt=""> HopeForUs</a></div>
<div class="wrap">
  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to manage your fundraisers.</p>
    <div class="err" id="err"></div>
    <label>Email</label>
    <input id="email" type="email" autocomplete="email">
    <label>Password</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button class="btn" id="btn" type="button">Log in</button>
    <p class="foot">New here? <a href="signup.html">Sign up</a></p>
    <p class="admin">Admin: admin@hopeforus.com / Admin@2026</p>
  </div>
</div>
<script src="app.js"></script>
<script>
document.getElementById('btn').onclick=function(){
  var err=document.getElementById('err');err.style.display='none';
  var r=HF.login(document.getElementById('email').value,document.getElementById('pass').value);
  if(!r.ok){err.textContent=r.err;err.style.display='block';return}
  location.href=r.user.isAdmin?'admin.html':'dashboard.html';
};
</script>
</body>
</html>
