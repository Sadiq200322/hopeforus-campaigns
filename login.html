<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign in – HopeForUs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Inter,system-ui,sans-serif;background:#f3f2f0;display:flex;align-items:center;justify-content:center;padding:20px;color:#1a1a1a}
.card{background:#fff;border-radius:20px;padding:36px 28px 28px;width:100%;max-width:400px;box-shadow:0 16px 48px rgba(0,0,0,.1);position:relative}
.x{position:absolute;top:14px;right:14px;width:36px;height:36px;border:0;background:0;border-radius:50%;font-size:1.2rem;color:#5c5c5c;cursor:pointer;text-decoration:none;display:grid;place-items:center}
.mark{text-align:center;color:#7C3AED;margin-bottom:12px}
h1{text-align:center;font-size:1.75rem;font-weight:800}
.sub{text-align:center;color:#5c5c5c;margin:8px 0 22px;font-size:.95rem}
label{display:block;font-size:.8rem;font-weight:600;color:#5c5c5c;margin:0 0 6px}
input{width:100%;height:48px;padding:0 14px;border:1.5px solid #e5e5e5;border-radius:12px;font-size:.95rem;font-family:inherit;margin-bottom:12px}
input:focus{outline:none;border-color:#7C3AED}
.pbtn{width:100%;height:48px;border-radius:999px;border:0;background:#4C1D95;color:#E9D5FF;font-weight:700;margin-top:8px;font-family:inherit;cursor:pointer}
.err{color:#b91c1c;font-size:.85rem;margin-top:8px;display:none}
.err.show{display:block}
.home{display:block;text-align:center;margin-top:16px;font-size:.9rem;color:#5c5c5c}
.home a{color:#7C3AED;font-weight:700}
.admin-hint{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:.85rem;color:#5b21b6;line-height:1.4}
</style>
</head>
<body>
<div class="card">
  <a href="/" class="x" aria-label="Close">×</a>
  <div class="mark"><svg width="36" height="36" viewBox="0 0 32 32"><path fill="currentColor" d="M16 3c.6 2.4 1.4 4 3.2 5.2C21.4 9.6 24 10.2 27 10c-2.2 1.6-3.4 3.4-4 5.8-.6 2.6-.4 5 .8 7.4-2.6-.2-4.8.4-6.6 1.8-1.6 1.2-2.6 2.8-3.2 4.8-.6-2-1.6-3.6-3.2-4.8-1.8-1.4-4-2-6.6-1.8 1.2-2.4 1.4-4.8.8-7.4C4.4 13.4 3.2 11.6 1 10c3 .2 5.6-.4 7.8-1.8C10.6 7 11.4 5.4 12 3c.8 2.2 2 3.8 4 5.2z"/></svg></div>
  <h1>Welcome back</h1>
  <p class="sub">Sign in with your email and password.</p>
  <div class="admin-hint" id="adminHint" style="display:none">
    <strong>Admin login</strong><br>
    Email: <code>admin@hopeforus.com</code><br>
    Password: <code>Admin@2026</code>
  </div>
  <label>Email</label>
  <input type="email" id="email" placeholder="you@email.com" autocomplete="email">
  <label>Password</label>
  <input type="password" id="pass" placeholder="Your password" autocomplete="current-password">
  <p class="err" id="err"></p>
  <button type="button" class="pbtn" id="go">Sign in</button>
  <div id="codeBox" style="display:none">
    <label>Code from your email</label>
    <input id="code" inputmode="numeric" placeholder="6-digit code" autocomplete="one-time-code">
    <div id="newPass" style="display:none">
      <label>New password</label>
      <input id="np" type="password" placeholder="At least 6 characters">
    </div>
    <button type="button" class="pbtn" id="useCode">Continue</button>
  </div>
  <p class="home"><a href="#" id="sendCode">Email me a code</a> · <a href="#" id="resetLink">Reset password</a></p>
  <p class="home">New here? <a href="/start">Start a fundraiser</a></p>
</div>
<script src="/app.js"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var returnTo = params.get('return') || '';
  if (returnTo.indexOf('admin') !== -1 || document.referrer.indexOf('admin') !== -1) {
    document.getElementById('adminHint').style.display = 'block';
  }
  if (HF.isAdmin() && returnTo.indexOf('admin') !== -1) {
    location.replace('/dashboard/#admin');
    return;
  }
  var mode='login';
  function showErr(t){var err=document.getElementById('err'); err.textContent=t||''; err.classList.toggle('show', !!t)}
  function mail(email, code){
    return fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      service_id:'service_w6qtun6', template_id:'template_zukhkib', user_id:'HHYAAwQ9y_LhuJ7qR',
      template_params:{to_email:email, email:email, user_name:'HopeForUs', otp_code:code, passcode:code, site_name:'Use this code to sign in or reset your HopeForUs password. It expires in 15 minutes.'}
    })});
  }
  function after(user){
    if(user&&user.isAdmin) location.href='/dashboard/#admin';
    else location.href=(returnTo && returnTo.indexOf('http')!==0 && returnTo.indexOf('admin')===-1)?returnTo:'/dashboard/';
  }
  document.getElementById('sendCode').onclick=function(e){e.preventDefault(); mode='code'; document.getElementById('newPass').style.display='none'; ask()};
  document.getElementById('resetLink').onclick=function(e){e.preventDefault(); mode='reset'; document.getElementById('newPass').style.display='block'; ask()};
  function ask(){
    var email=document.getElementById('email').value.trim().toLowerCase();
    showErr('');
    if(email.indexOf('@')<0){showErr('Enter the email on the account.');return}
    var r=HF.beginCode(email);
    if(!r.ok){showErr(r.err);return}
    document.getElementById('codeBox').style.display='block';
    mail(email, r.code).then(function(res){showErr(res.ok?'Code sent to '+email+'.':'Could not email the code. Try again.')}).catch(function(){showErr('Could not email the code. Try again.')});
  }
  document.getElementById('useCode').onclick=function(){
    var email=document.getElementById('email').value.trim().toLowerCase();
    var code=document.getElementById('code').value.trim();
    var r=mode==='reset'?HF.resetPassword(email, code, document.getElementById('np').value):HF.loginWithCode(email, code);
    if(!r.ok){showErr(r.err);return}
    after(r.user);
  };
  document.getElementById('go').onclick = function(){
    var email = document.getElementById('email').value.trim().toLowerCase();
    var pass  = document.getElementById('pass').value;
    var err   = document.getElementById('err');
    err.classList.remove('show');
    if (!email || !pass) { err.textContent = 'Enter email and password.'; err.classList.add('show'); return; }
    var result = HF.login(email, pass);
    if (!result.ok) { showErr(result.err || 'Email or password is incorrect.'); return; }
    after(result.user);
  };
  document.getElementById('pass').addEventListener('keydown', function(e){ if (e.key === 'Enter') document.getElementById('go').click(); });
})();
</script>
</body>
</html>
