<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign in – HopeForUs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Inter,system-ui,sans-serif;background:#f4f2f8;display:flex;align-items:center;justify-content:center;padding:24px 16px;color:#1c1c1c}
.card{background:#fff;border-radius:24px;padding:32px 26px 26px;width:100%;max-width:420px;box-shadow:0 18px 50px rgba(76,29,149,.12);position:relative}
.x{position:absolute;top:14px;right:14px;width:36px;height:36px;border:0;background:#f4f2f8;border-radius:50%;font-size:1.2rem;color:#5c5c5c;cursor:pointer;text-decoration:none;display:grid;place-items:center}
.mark{text-align:center;color:#4C1D95;margin-bottom:8px}
h1{text-align:center;font-size:1.65rem;font-weight:800;letter-spacing:-.03em}
.sub{text-align:center;color:#6b6575;margin:8px 0 18px;font-size:.95rem;line-height:1.45}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:#f4f2f8;border-radius:999px;padding:4px;margin-bottom:18px}
.tabs button{border:0;background:transparent;height:36px;border-radius:999px;font:inherit;font-size:.78rem;font-weight:700;color:#6b6575;cursor:pointer}
.tabs button.on{background:#fff;color:#4C1D95;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.steps i{width:8px;height:8px;border-radius:99px;background:#e6e1ef;display:block}
.steps i.on{width:22px;background:#4C1D95}
label{display:block;font-size:.78rem;font-weight:700;color:#6b6575;margin:0 0 6px}
input{width:100%;height:48px;padding:0 14px;border:1.5px solid #e7e3ee;border-radius:12px;font-size:1rem;font-family:inherit;margin-bottom:12px;background:#fff}
input:focus{outline:none;border-color:#4C1D95}
.pbtn{width:100%;height:48px;border-radius:999px;border:0;background:#4C1D95;color:#fff;font-weight:800;margin-top:4px;font-family:inherit;font-size:1rem;cursor:pointer}
.pbtn:disabled{opacity:.6;cursor:default}
.err{color:#b91c1c;font-size:.85rem;min-height:1.1em;margin:2px 0 8px}
.ok{color:#067647;font-size:.85rem;min-height:1.1em;margin:2px 0 8px}
.back{display:block;text-align:center;margin-top:14px;background:none;border:0;color:#4C1D95;font:inherit;font-weight:700;cursor:pointer}
.home{display:block;text-align:center;margin-top:14px;font-size:.9rem;color:#6b6575}
.home a{color:#4C1D95;font-weight:700;text-decoration:none}
.panel{display:none}
.panel.on{display:block}
code{font-size:.85rem}
</style>
</head>
<body>
<div class="card">
  <a href="/" class="x" aria-label="Close">×</a>
  <div class="mark"><svg width="36" height="36" viewBox="0 0 32 32"><path fill="currentColor" d="M16 3c.6 2.4 1.4 4 3.2 5.2C21.4 9.6 24 10.2 27 10c-2.2 1.6-3.4 3.4-4 5.8-.6 2.6-.4 5 .8 7.4-2.6-.2-4.8.4-6.6 1.8-1.6 1.2-2.6 2.8-3.2 4.8-.6-2-1.6-3.6-3.2-4.8-1.8-1.4-4-2-6.6-1.8 1.2-2.4 1.4-4.8.8-7.4C4.4 13.4 3.2 11.6 1 10c3 .2 5.6-.4 7.8-1.8C10.6 7 11.4 5.4 12 3c.8 2.2 2 3.8 4 5.2z"/></svg></div>
  <h1 id="title">Welcome back</h1>
  <p class="sub" id="sub">Sign in with your email and password.</p>
  <div class="tabs">
    <button type="button" data-view="pass" class="on">Password</button>
    <button type="button" data-view="code">Email code</button>
    <button type="button" data-view="reset">Reset</button>
  </div>

  <div class="panel on" id="pass">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@email.com" autocomplete="username">
    <label>Password</label>
    <input type="password" id="passw" placeholder="Your password" autocomplete="current-password">
    <p class="err" id="perr"></p>
    <button type="button" class="pbtn" id="go">Sign in</button>
  </div>

  <div class="panel" id="code">
    <div class="steps"><i class="on" id="c1"></i><i id="c2"></i></div>
    <div id="codeStep1">
      <label>Email</label>
      <input type="email" id="cemail" placeholder="you@email.com" autocomplete="username">
      <p class="err" id="cerr"></p>
      <p class="ok" id="cok"></p>
      <button type="button" class="pbtn" id="sendCode">Send code</button>
    </div>
    <div id="codeStep2" style="display:none">
      <label>Code from your email</label>
      <input id="ccode" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code">
      <p class="err" id="cerr2"></p>
      <button type="button" class="pbtn" id="useCode">Sign in</button>
      <button type="button" class="back" id="codeBack">Use a different email</button>
    </div>
  </div>

  <div class="panel" id="reset">
    <div class="steps"><i class="on" id="r1"></i><i id="r2"></i></div>
    <div id="resetStep1">
      <label>Email</label>
      <input type="email" id="remail" placeholder="you@email.com" autocomplete="username">
      <label>New password</label>
      <input type="password" id="np1" placeholder="At least 6 characters" autocomplete="new-password">
      <label>Confirm password</label>
      <input type="password" id="np2" placeholder="Type it again" autocomplete="new-password">
      <p class="err" id="rerr"></p>
      <button type="button" class="pbtn" id="sendReset">Send code</button>
    </div>
    <div id="resetStep2" style="display:none">
      <label>Code from your email</label>
      <input id="rcode" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code">
      <p class="err" id="rerr2"></p>
      <p class="ok" id="rok"></p>
      <button type="button" class="pbtn" id="doReset">Change password</button>
      <button type="button" class="back" id="resetBack">Start over</button>
    </div>
  </div>

  <p class="home">New here? <a href="/start">Start a fundraiser</a></p>
</div>
<script src="/app.js"></script>
<script src="/emailjs-config.js"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var returnTo = params.get('return') || '';
  var cfg = window.HOPEFORUS_EMAILJS || {};
  var pendingPass = '';

  function show(name){
    document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('on', p.id===name)});
    document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on', b.getAttribute('data-view')===name)});
    var titles = {pass:['Welcome back','Sign in with your email and password.'], code:['Sign in with a code','Enter your email. We will send a 6-digit code.'], reset:['Reset password','Enter your email and a new password. We email a code before it changes.']};
    document.getElementById('title').textContent = titles[name][0];
    document.getElementById('sub').textContent = titles[name][1];
  }
  document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){show(b.getAttribute('data-view'))}});
  if(location.hash==='#code') show('code');
  if(location.hash==='#reset') show('reset');

  function mail(email, code, kind){
    var note = kind==='reset'
      ? 'Use this code to confirm your new HopeForUs password. It expires in 15 minutes.'
      : 'Use this code to sign in to HopeForUs. It expires in 15 minutes.';
    return fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      service_id: cfg.serviceId || 'service_w6qtun6',
      template_id: cfg.templateId || 'template_zukhkib',
      user_id: cfg.publicKey || 'HHYAAwQ9y_LhuJ7qR',
      template_params:{to_email:email, email:email, user_name:'HopeForUs', otp_code:code, passcode:code, site_name:note}
    })});
  }
  function after(user){
    if(user && user.isAdmin) location.href='/dashboard/#admin';
    else location.href=(returnTo && returnTo.indexOf('http')!==0) ? returnTo : '/dashboard/';
  }
  function setBusy(btn, on, label){
    btn.disabled=on; btn.textContent=on?'Sending…':label;
  }

  document.getElementById('go').onclick=function(){
    var email=document.getElementById('email').value.trim().toLowerCase();
    var pass=document.getElementById('passw').value;
    var err=document.getElementById('perr');
    err.textContent='';
    if(!email||!pass){err.textContent='Enter email and password.';return}
    var result=HF.login(email, pass);
    if(!result.ok){err.textContent=result.err||'Email or password is incorrect.';return}
    after(result.user);
  };
  document.getElementById('passw').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('go').click(); });

  document.getElementById('sendCode').onclick=function(){
    var btn=this;
    var email=document.getElementById('cemail').value.trim().toLowerCase();
    var err=document.getElementById('cerr'); var ok=document.getElementById('cok');
    err.textContent=''; ok.textContent='';
    if(email.indexOf('@')<0){err.textContent='Enter the email on the account.';return}
    var r=HF.beginCode(email);
    if(!r.ok){err.textContent=r.err;return}
    setBusy(btn,true,'Send code');
    mail(email, r.code, 'login').then(function(res){
      setBusy(btn,false,'Send code');
      if(!res.ok){err.textContent='Could not send the email. Try again.';return}
      document.getElementById('codeStep1').style.display='none';
      document.getElementById('codeStep2').style.display='block';
      document.getElementById('c1').classList.remove('on');
      document.getElementById('c2').classList.add('on');
      document.getElementById('sub').textContent='Enter the code we sent to '+email+'.';
    }).catch(function(){setBusy(btn,false,'Send code'); err.textContent='Could not send the email. Try again.';});
  };
  document.getElementById('codeBack').onclick=function(){
    document.getElementById('codeStep2').style.display='none';
    document.getElementById('codeStep1').style.display='block';
    document.getElementById('c2').classList.remove('on');
    document.getElementById('c1').classList.add('on');
  };
  document.getElementById('useCode').onclick=function(){
    var email=document.getElementById('cemail').value.trim().toLowerCase();
    var r=HF.loginWithCode(email, document.getElementById('ccode').value.trim());
    if(!r.ok){document.getElementById('cerr2').textContent=r.err;return}
    after(r.user);
  };

  document.getElementById('sendReset').onclick=function(){
    var btn=this;
    var email=document.getElementById('remail').value.trim().toLowerCase();
    var a=document.getElementById('np1').value, b=document.getElementById('np2').value;
    var err=document.getElementById('rerr');
    err.textContent='';
    if(email.indexOf('@')<0){err.textContent='Enter the email on the account.';return}
    if(!a||a.length<6){err.textContent='Password needs 6 characters.';return}
    if(a!==b){err.textContent='Passwords do not match.';return}
    var r=HF.beginCode(email);
    if(!r.ok){err.textContent=r.err;return}
    pendingPass=a;
    setBusy(btn,true,'Send code');
    mail(email, r.code, 'reset').then(function(res){
      setBusy(btn,false,'Send code');
      if(!res.ok){err.textContent='Could not send the email. The password was not changed.';return}
      document.getElementById('resetStep1').style.display='none';
      document.getElementById('resetStep2').style.display='block';
      document.getElementById('r1').classList.remove('on');
      document.getElementById('r2').classList.add('on');
      document.getElementById('sub').textContent='Enter the code sent to '+email+' to finish the change.';
    }).catch(function(){setBusy(btn,false,'Send code'); err.textContent='Could not send the email. The password was not changed.';});
  };
  document.getElementById('resetBack').onclick=function(){
    pendingPass='';
    document.getElementById('resetStep2').style.display='none';
    document.getElementById('resetStep1').style.display='block';
    document.getElementById('r2').classList.remove('on');
    document.getElementById('r1').classList.add('on');
  };
  document.getElementById('doReset').onclick=function(){
    var email=document.getElementById('remail').value.trim().toLowerCase();
    var r=HF.resetPassword(email, document.getElementById('rcode').value.trim(), pendingPass);
    var err=document.getElementById('rerr2');
    if(!r.ok){err.textContent=r.err;return}
    document.getElementById('rok').textContent='Password changed. Opening your desk…';
    setTimeout(function(){after(r.user)}, 500);
  };
})();
</script>
</body>
</html>
