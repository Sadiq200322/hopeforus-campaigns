<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Campaign – HopeForUs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw}
body{font-family:'Inter',system-ui,sans-serif;color:#1a1a1a;background:#fff;line-height:1.5}
a{color:inherit;text-decoration:none}img,video{max-width:100%;display:block}
.wrap{max-width:1080px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 100px max(16px,env(safe-area-inset-left))}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:50}
.logo{font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.logo img{width:28px;height:28px}
h1{font-size:clamp(1.4rem,3.5vw,1.85rem);font-weight:800;line-height:1.2;margin:8px 0 20px;word-break:break-word}
.grid{display:grid;gap:28px}
@media(min-width:900px){.grid{grid-template-columns:1fr 320px;gap:36px;align-items:start}.sticky{position:sticky;top:72px}}
.gallery{position:relative;border-radius:16px;overflow:hidden;background:#e8e8e8;aspect-ratio:16/10;max-width:100%}
.gallery img,.gallery video{width:100%;height:100%;object-fit:cover;display:block}
.gallery .nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.92);cursor:pointer;font-size:1.2rem;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.gallery .nav-btn.prev{left:10px}.gallery .nav-btn.next{right:10px}
.gallery .dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.gallery .dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
.gallery .dots span.on{background:#fff}
.org-line{display:flex;align-items:center;gap:10px;margin:14px 0 10px;font-size:.9rem}
.org-av{width:32px;height:32px;border-radius:50%;background:#7C3AED;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0}
.badge-protected{display:inline-flex;align-items:center;gap:6px;background:#e8f4fc;color:#0b6e99;font-size:.78rem;font-weight:600;padding:6px 12px;border-radius:8px;margin-bottom:16px}
.story{font-size:.95rem;color:#333;white-space:pre-wrap;word-break:break-word;line-height:1.65;margin-bottom:16px}
.story-btns{display:flex;gap:10px;margin:16px 0 28px}
.story-btns button{flex:1;padding:12px;border-radius:999px;font-weight:700;font-size:.95rem;cursor:pointer;border:1.5px solid #d0d0d0;background:#fff}
.story-btns button.primary{background:#7C3AED;color:#fff;border-color:#7C3AED}
.section{margin:28px 0;padding-top:20px;border-top:1px solid #f0f0f0}
.section h3{font-size:1.05rem;font-weight:700;margin-bottom:14px}
.org-row{display:flex;gap:16px;flex-wrap:wrap}
.org-card{flex:1;min-width:140px;padding:14px;border:1px solid #eee;border-radius:12px}
.org-label{font-size:.72rem;color:#888;margin-bottom:4px}
.org-name{font-weight:700}
.org-loc{font-size:.8rem;color:#666;margin-top:2px}
.msg{padding:14px 0;border-bottom:1px solid #f5f5f5}
.msg-name{font-weight:600;font-size:.9rem;margin-bottom:4px}
.msg-text{font-size:.88rem;color:#444;line-height:1.5}
.card{border:1px solid #e5e5e5;border-radius:16px;padding:20px;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.raised-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ring{width:52px;height:52px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#00a964}
.amt{font-size:1.35rem;font-weight:800;line-height:1.2}
.amt-sub{font-size:.85rem;color:#5c5c5c;margin-top:2px}
.btn-d{display:block;width:100%;text-align:center;background:#7C3AED;color:#fff;font-weight:700;padding:14px;border-radius:999px;border:0;cursor:pointer;font-size:1rem;margin:14px 0 8px}
.btn-s{display:block;width:100%;text-align:center;background:#1a1a1a;color:#fff;font-weight:700;padding:12px;border-radius:999px;border:0;cursor:pointer;font-size:.95rem}
.donors-side{margin-top:18px;padding-top:14px;border-top:1px solid #f0f0f0}
.donors-side h4{font-size:.9rem;font-weight:700;color:#7C3AED;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.donor-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.donor-av{width:34px;height:34px;border-radius:50%;background:#eee;color:#333;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0}
.donor-info{flex:1;min-width:0}
.donor-name{font-weight:600;font-size:.85rem}
.donor-meta{font-size:.75rem;color:#888}
.donor-amt{font-weight:700;font-size:.85rem;white-space:nowrap}
.donor-btns{display:flex;gap:8px;margin-top:12px}
.donor-btns button{flex:1;padding:8px;border-radius:999px;border:1.5px solid #ddd;background:#fff;font-weight:600;font-size:.8rem;cursor:pointer}
.mbar{display:none;position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #eee;gap:10px;z-index:60}
.mbar .btn-d,.mbar .btn-s{margin:0;flex:1;padding:12px}
@media(max-width:899px){.mbar{display:flex}.card .btn-d,.card .btn-s{display:none}.story-btns{display:none}}
</style>
</head>
<body>
<header class="hdr">
  <a href="index.html" class="logo"><img src="logo-mark.svg" alt=""> HopeForUs</a>
  <a href="index.html" style="font-weight:600;font-size:.9rem">← Home</a>
</header>
<div class="wrap" id="page"></div>
<div class="mbar" id="mbar">
  <button type="button" class="btn-d" id="mDonate">Donate now</button>
  <button type="button" class="btn-s" id="mShare">Share</button>
</div>
<script src="campaigns-data.js"></script>
<script>
if(typeof SAMPLES==="undefined")var SAMPLES=[];
function getId(){var q=new URLSearchParams(location.search);return q.get("id")||q.get("c")||""}
function loadList(){try{return JSON.parse(localStorage.getItem("hopeforus_campaigns")||"[]")}catch(e){return[]}}
function saveList(list){try{localStorage.setItem("hopeforus_campaigns",JSON.stringify(list))}catch(e){}}
function findC(id){
  var list=loadList(),map={};list.forEach(function(c,i){if(c&&c.id)map[c.id]=i});
  SAMPLES.forEach(function(s){
    if(map[s.id]===undefined)list.push(Object.assign({},s));
    else{
      var cur=list[map[s.id]]||{};
      list[map[s.id]]=Object.assign({},cur,s,{
        media:(cur.media&&cur.media.length)?cur.media:s.media,
        image:s.image||cur.image,
        story:s.story||cur.story,
        donors:s.donors||cur.donors,
        messages:s.messages||cur.messages,
        raised:s.raised!=null?s.raised:cur.raised,
        goal:s.goal!=null?s.goal:cur.goal,
        donations:s.donations!=null?s.donations:cur.donations,
        category:s.category||cur.category
      });
    }
  });
  try{saveList(list)}catch(e){}
  var c=list.find(function(x){return x&&(x.id===id||x.code===id)});
  if(!c)c=SAMPLES.find(function(x){return x.id===id||x.code===id});
  return c?{c:c,list:list}:null;
}
function pct(r,g){return g?Math.min(100,Math.round(r/g*100)):0}
function esc(s){
  var t=String(s==null?"":s);
  t=t.split(String.fromCharCode(38)).join(String.fromCharCode(38,97,109,112,59));
  t=t.split(String.fromCharCode(60)).join(String.fromCharCode(38,108,116,59));
  t=t.split(String.fromCharCode(62)).join(String.fromCharCode(38,103,116,59));
  t=t.split(String.fromCharCode(34)).join(String.fromCharCode(38,113,117,111,116,59));
  return t;
}
function money(n,c){c=c||"USD";var s=Number(n||0).toLocaleString();return c==="EUR"?"€"+s:c==="GBP"?"£"+s:"$"+s}
function fmtK(n){n=Number(n)||0;if(n>=1000)return(Math.round(n/100)/10)+"K";return String(n)}
function ringSvg(p){
  var r=22,circ=2*Math.PI*r,dash=(p/100)*circ;
  return '<svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="'+r+'" fill="none" stroke="#e8e8e8" stroke-width="5"/><circle cx="26" cy="26" r="'+r+'" fill="none" stroke="#00a964" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+dash+' '+circ+'"/></svg>';
}
var id=getId(),found=findC(id),gIdx=0,gItems=[];
if(!found){document.getElementById("page").innerHTML="<p style=\"padding:40px 0\">Campaign not found. <a href=\"index.html\">Home</a></p>"}else{render(found)}
function render(found){
  var c=found.c;document.title=(c.title||"Campaign")+" – HopeForUs";
  var raised=Number(c.raised)||0,goal=Number(c.goal)||1,p=pct(raised,goal);
  gItems=[];
  if(c.cover&&c.cover.dataUrl)gItems.push(c.cover);
  else if(c.image)gItems.push({type:"image",dataUrl:c.image});
  if(c.media)c.media.forEach(function(m){
    if(!m)return;
    if(typeof m==="string"){gItems.push({type:"image",dataUrl:m});return;}
    if(m.dataUrl)gItems.push(m);
    else if(m.url)gItems.push({type:m.type||"image",dataUrl:m.url});
  });
  if(gIdx>=gItems.length)gIdx=0;
  var cover=gItems.length?(function(){
    var g=gItems[gIdx];
    if(g.type&&String(g.type).indexOf("video")===0)
      return '<video src="'+g.dataUrl+'" autoplay muted loop playsinline webkit-playsinline preload="auto" style="width:100%;height:100%;object-fit:cover"></video>';
    return '<img src="'+g.dataUrl+'" alt="" loading="eager" decoding="async">';
  })():'<div style="width:100%;height:100%;background:linear-gradient(135deg,#7C3AED,#4C1D95);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;padding:20px;text-align:center">'+esc((c.title||"").slice(0,40))+'</div>';
  var dots="",nav="";
  if(gItems.length>1){
    dots='<div class="dots">'+gItems.map(function(_,i){return '<span class="'+(i===gIdx?'on':'')+'"></span>'}).join('')+'</div>';
    nav='<button type="button" class="nav-btn prev" id="galPrev">‹</button><button type="button" class="nav-btn next" id="galNext">›</button>';
  }
  var orgInitial=(c.organizer||"O").charAt(0).toUpperCase();
  var donorsSide="";
  if(c.donors&&c.donors.length){
    donorsSide='<div class="donors-side"><h4><span style="font-size:1.1rem">↗</span> '+(c.donations?fmtK(c.donations):c.donors.length)+' recent donations</h4>'+
      c.donors.slice(0,6).map(function(d){
        var initial=(d.name||"A").charAt(0).toUpperCase();
        return '<div class="donor-row"><div class="donor-av">'+esc(initial)+'</div>'+
          '<div class="donor-info"><div class="donor-name">'+esc(d.name)+'</div>'+
          '<div class="donor-meta">'+money(d.amount,c.currency)+(d.note?' · '+esc(d.note):'')+'</div></div></div>';
      }).join('')+
      '<div class="donor-btns"><button type="button">See all</button><button type="button">★ See top</button></div></div>';
  }
  var msgsHtml="";
  if(c.messages&&c.messages.length){
    msgsHtml='<div class="section"><h3>Words of support</h3>'+
      c.messages.map(function(m){
        return '<div class="msg"><div class="msg-name">'+esc(m.name)+'</div><div class="msg-text">'+esc(m.text)+'</div></div>';
      }).join('')+'</div>';
  }
  var orgHtml='<div class="section"><h3>Organizer and beneficiary</h3><div class="org-row">'+
    '<div class="org-card"><div class="org-label">Organizer</div><div class="org-name">'+esc(c.organizer||"Organizer")+'</div>'+
    (c.organizerLocation?'<div class="org-loc">'+esc(c.organizerLocation)+'</div>':'')+'</div>'+
    (c.beneficiary?'<div class="org-card"><div class="org-label">Beneficiary</div><div class="org-name">'+esc(c.beneficiary)+'</div></div>':'')+
    '</div></div>';
  var left=
    '<div class="gallery">'+cover+dots+nav+'</div>'+
    '<div class="org-line"><div class="org-av">'+esc(orgInitial)+'</div><div><strong>'+esc(c.organizer||"Organizer")+'</strong>'+(c.beneficiary?' for '+esc(c.beneficiary):'')+'</div></div>'+
    '<div class="badge-protected">🛡 Donation protected</div>'+
    '<div class="story">'+esc(c.story||"No story yet.")+'</div>'+
    '<div class="story-btns"><button type="button" class="primary" id="storyDonate">Donate</button><button type="button" id="storyShare">Share</button></div>'+
    orgHtml+msgsHtml;
  var right=
    '<div class="sticky"><div class="card">'+
    '<div class="raised-row"><div class="ring">'+ringSvg(p)+'<div class="ring-pct">'+p+'%</div></div>'+
    '<div><div class="amt">'+money(raised,c.currency)+' raised</div>'+
    '<div class="amt-sub">of '+money(goal,c.currency)+' '+(c.currency||"USD")+' · '+fmtK(c.donations||0)+' donations</div></div></div>'+
    '<button type="button" class="btn-d" id="donateBtn">Donate now</button>'+
    '<button type="button" class="btn-s" id="shareBtn">Share</button>'+
    donorsSide+
    '</div></div>';
  document.getElementById("page").innerHTML='<h1>'+esc(c.title)+'</h1><div class="grid"><div>'+left+'</div>'+right+'</div>';
  function openDonate(){alert("Donate flow coming soon.");}
  function doShare(){
    var url=location.href;
    if(navigator.share){navigator.share({title:c.title,url:url}).catch(function(){});}
    else if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){alert("Link copied!")});}
    else{prompt("Copy link",url)}
  }
  ["donateBtn","mDonate","storyDonate"].forEach(function(id){var el=document.getElementById(id);if(el)el.onclick=openDonate;});
  ["shareBtn","mShare","storyShare"].forEach(function(id){var el=document.getElementById(id);if(el)el.onclick=doShare;});
  if(window._galTimer){clearInterval(window._galTimer);window._galTimer=null;}
  if(gItems.length>1){
    var prev=document.getElementById("galPrev"),next=document.getElementById("galNext");
    if(prev)prev.onclick=function(){gIdx=(gIdx-1+gItems.length)%gItems.length;render(findC(id));};
    if(next)next.onclick=function(){gIdx=(gIdx+1)%gItems.length;render(findC(id));};
    window._galTimer=setInterval(function(){if(document.hidden)return;gIdx=(gIdx+1)%gItems.length;render(findC(id));},4000);
  }
  var gv=document.querySelector(".gallery video");
  if(gv){gv.muted=true;gv.playsInline=true;var pr=gv.play();if(pr&&pr.catch)pr.catch(function(){});}
}
</script>
</body>
</html>
