<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Campaign – HopeForUs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#7C3AED;--p-dark:#4C1D95;--p-light:#EDE9FE;--black:#1a1a1a;--muted:#5c5c5c;--border:#e5e5e5;--font:Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--black);background:#fff;line-height:1.5}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}img{max-width:100%;display:block}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:50;gap:12px}
.logo{font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.hdr-actions{display:flex;align-items:center;gap:8px}
.btn-p{background:var(--p);color:#fff;border:none;font-weight:700;padding:10px 18px;border-radius:999px;font-size:.9rem;text-decoration:none}
.btn-g{background:#f3f4f6;color:#1a1a1a;border:none;font-weight:600;padding:10px 14px;border-radius:999px;font-size:.88rem;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 100px;display:grid;gap:28px}
@media(min-width:900px){.wrap{grid-template-columns:1fr 340px;align-items:start;padding-bottom:60px}}
.main h1{font-size:clamp(1.4rem,3vw,1.85rem);font-weight:800;line-height:1.2;margin-bottom:12px}
.hero-img{width:100%;border-radius:16px;overflow:hidden;margin-bottom:16px;background:#eee;aspect-ratio:16/10}
.hero-img img{width:100%;height:100%;object-fit:cover}
.section{margin:28px 0}.section h3{font-size:1.15rem;font-weight:800;margin-bottom:8px}
.story{font-size:.95rem;color:#333;line-height:1.65;white-space:pre-wrap}
.story.clamp{-webkit-line-clamp:6;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.read-more{background:none;border:none;color:var(--p);font-weight:700;font-size:.9rem;margin-top:8px;padding:0}
.side{position:sticky;top:72px;z-index:30}
.card{border:1px solid var(--border);border-radius:20px;padding:18px;background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.08)}
.raise-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ring{width:64px;height:64px;flex-shrink:0;position:relative}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;color:#111}
.raise-meta{flex:1;min-width:0}
.raised{font-size:1.25rem;font-weight:800;line-height:1.2}
.raised span{font-weight:600;color:#6b7280;font-size:1rem}
.recent-line{font-size:.85rem;color:#6b7280;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-donate{display:block;width:100%;background:var(--p);color:#fff;border:none;font-weight:800;padding:14px 12px;border-radius:999px;font-size:1rem;text-align:center}
.btn-donate.disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;pointer-events:none}
.btn-share{display:block;width:100%;background:var(--p-dark);color:#E9D5FF;border:none;font-weight:800;padding:14px 12px;border-radius:999px;font-size:1rem;text-align:center}
.review-note{font-size:.78rem;color:#92400e;margin-top:8px;text-align:center;font-weight:600}
@media(max-width:899px){
  .side{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));top:auto;z-index:60;padding:0;margin:0;width:auto}
  .card{border-radius:20px;border:1px solid #e8e8e8;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:12px 14px}
  .raise-row{margin-bottom:10px}
  .ring{width:52px;height:52px}
  .ring svg{width:52px;height:52px}
  .ring-pct{font-size:.75rem}
  .raised{font-size:1.05rem}
  .raised span{font-size:.9rem}
  .wrap{padding-bottom:140px}
}
.donors{margin-top:8px}
.donor{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #f0f0f0;font-size:.88rem}
.donor:last-child{border:0}
.d-av{width:36px;height:36px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:.8rem}
.share-promo{margin:28px 0}
.share-promo h3{font-size:1.15rem;font-weight:800;margin-bottom:6px}
.share-promo .sub{font-size:.92rem;color:#5c5c5c;margin-bottom:16px;line-height:1.5;max-width:520px}
.sc-frame{background:#f0f1f3;border-radius:20px;padding:16px}
.sc-inner{background:#fff;border-radius:16px;overflow:hidden;position:relative;display:grid;grid-template-columns:1.1fr 1fr;min-height:200px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
@media(max-width:560px){.sc-inner{grid-template-columns:1fr}}
.sc-left{padding:18px 16px 16px;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:2}
.sc-logo{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.85rem;color:var(--p);margin-bottom:10px}
.sc-title{font-weight:800;font-size:1.05rem;line-height:1.25;margin-bottom:10px}
.sc-org{font-size:.85rem;color:#6b7280}
.sc-org strong{display:block;color:#374151;font-weight:700}
.sc-right{position:relative;min-height:180px;background:#ddd}
.sc-right img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.sc-heart{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:3}
.sc-overlay{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:3;flex-wrap:wrap;justify-content:center;width:90%}
.sc-pct{width:56px;height:56px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.sc-pct svg{position:absolute;inset:0;width:56px;height:56px;transform:rotate(-90deg)}
.sc-pct span{font-size:.75rem;font-weight:800;position:relative;z-index:1}
.sc-raised{background:var(--p);color:#fff;font-weight:800;font-size:.8rem;padding:6px 12px;border-radius:999px;white-space:nowrap}
.sc-donow{background:var(--p-light);color:var(--p-dark);font-weight:800;font-size:.78rem;padding:6px 12px;border-radius:999px;white-space:nowrap}
.sc-icons{display:flex;gap:10px;justify-content:center;padding:14px 0 4px;flex-wrap:wrap}
.sc-icons a,.sc-icons button{width:40px;height:40px;border-radius:50%;border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
.sc-icons .ic-copy{background:#e5e7eb;color:#374151}
.sc-icons .ic-fb{background:#1877f2}
.sc-icons .ic-wa{background:#25d366}
.sc-icons .ic-ms{background:#0084ff}
.sc-icons .ic-li{background:#0a66c2}
.ft{text-align:center;padding:24px;color:var(--muted);font-size:.85rem;border-top:1px solid #eee}
.copy-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:999px;font-size:.85rem;font-weight:600;z-index:300;display:none}
.copy-toast.on{display:block}
</style>
</head>
<body>
<header class="hdr">
  <a href="/" class="logo">HopeForUs</a>
  <div class="hdr-actions" id="hdrActions"></div>
</header>
<div class="wrap" id="app"><p style="padding:40px;color:#666">Loading campaign…</p></div>
<footer class="ft">© 2026 HopeForUs</footer>
<script src="campaigns-data.js"></script>
<script>
(function(){
try {
  if (!localStorage.getItem('hopeforus_cleared_v3')) {
    localStorage.removeItem('hopeforus_users');
    localStorage.removeItem('hopeforus_user');
    localStorage.removeItem('hopeforus_otp');
    localStorage.removeItem('hopeforus_pending_donations');
    var camps = [];
    try { camps = JSON.parse(localStorage.getItem('hopeforus_campaigns') || '[]'); } catch(e) {}
    if (Array.isArray(camps)) {
      camps = camps.filter(function(c) {
        return c && !c.ownerId && !c.ownerEmail && !c.organizerEmail;
      });
      localStorage.setItem('hopeforus_campaigns', JSON.stringify(camps));
    }
    localStorage.setItem('hopeforus_cleared_v3', '1');
  }
} catch(e) {}

var u=null;try{u=JSON.parse(localStorage.getItem("hopeforus_user")||"null")}catch(e){}
var ha=document.getElementById("hdrActions");
if(u&&u.email){
  ha.innerHTML='<a href="/dashboard" class="btn-g">My campaigns</a><a href="/start" class="btn-p">New fundraiser</a>';
}else{
  ha.innerHTML='<a href="/start" class="btn-p">Start a HopeForUs</a>';
}

function esc(s){var a=String.fromCharCode(38);return String(s||"").replace(/&/g,a+"amp;").replace(/</g,a+"lt;").replace(/>/g,a+"gt;").replace(/"/g,a+"quot;")}
function money(n,c){c=c||"USD";var s=Number(n||0).toLocaleString();return c==="EUR"?"\u20ac"+s:c==="GBP"?"\u00a3"+s:"$"+s}
function moneyShort(n,c){
  n=Number(n)||0;c=c||"USD";
  var pre=c==="EUR"?"\u20ac":c==="GBP"?"\u00a3":"$";
  if(n>=1000)return pre+(n/1000).toFixed(n%1000===0?0:1).replace(/\.0$/,"")+"K";
  return pre+n.toLocaleString();
}
var params=new URLSearchParams(location.search);
var id=(params.get("id")||"").trim();
var idLower=id.toLowerCase();
var list=[];
try{list=JSON.parse(localStorage.getItem("hopeforus_campaigns")||"[]")||[]}catch(e){}
if(!Array.isArray(list))list=[];
function matchCamp(x){
  if(!x)return false;
  var xid=String(x.id||"").toLowerCase();
  var xcode=String(x.code||"").toLowerCase();
  return xid===idLower || xcode===idLower;
}
var c=null;
for(var i=0;i<list.length;i++){if(matchCamp(list[i])){c=list[i];break}}
if(!c&&typeof SAMPLES!=="undefined"){
  for(var j=0;j<SAMPLES.length;j++){if(matchCamp(SAMPLES[j])){c=SAMPLES[j];break}}
}
if(!c){
  document.getElementById("app").innerHTML='<p style="padding:40px">Campaign not found. <a href="/" style="color:#7C3AED">Back home</a></p>';
  return;
}
var raised=Number(c.raised)||0,goal=Math.max(1,Number(c.goal)||1);
var p=Math.min(100,Math.round(raised/goal*100));
var story=c.story||"";
var shortCode=(c.code||c.id||id||'').toString();
var shareUrl=(location.origin||'https://munowatchplus.watch')+'/c/'+encodeURIComponent(shortCode);
var shareEnc=encodeURIComponent(shareUrl);
// Always normalize address bar to canonical short path (keeps case consistent on refresh)
try{
  if(history.replaceState){
    var want='/c/'+encodeURIComponent(shortCode);
    var keep=location.search.indexOf('donated')>=0?location.search:'';
    if(location.pathname+location.search !== want+keep) history.replaceState(null,'',want+keep);
  }
}catch(e){}
var donorsArr=c.donors||[];
var donors=donorsArr.slice(0,12).map(function(d){
  var n=(d.name||"A").charAt(0).toUpperCase();
  return '<div class="donor"><div class="d-av">'+n+'</div><div><strong>'+esc(d.name)+'</strong><div style="color:#666">'+money(d.amount,c.currency)+(d.time?' · '+esc(d.time):'')+'</div></div></div>';
}).join("");
var ringCirc=2*Math.PI*26;
var ringOff=ringCirc*(1-Math.min(1,p/100));
var topDonor=donorsArr[0]||null;
var recentTxt=topDonor?(esc(topDonor.name||"Someone")+" donated "+money(topDonor.amount,c.currency)+" \u203a"):((c.donations||0)+" donations");
var scCirc=2*Math.PI*22;
var scOff=scCirc*(1-Math.min(1,p/100));
var img=c.image||"";
var donationLink=(c.donationLink||"").trim();
var isLive=!!donationLink && (c.status!=="rejected");
var donateBtn=isLive
  ? '<a href="'+esc(donationLink)+'" class="btn-donate" target="_blank" rel="noopener">Donate</a>'
  : '<button type="button" class="btn-donate disabled">Under review</button>';
var reviewNote=isLive ? '' : '<div class="review-note">Donations open after admin review</div>';
var shareCard=
  '<div class="share-promo">'+
  '<h3>Sharing helps more than you think</h3>'+
  '<p class="sub">On average, <strong>each share can inspire $50</strong> in donations by helping this fundraiser reach more people.</p>'+
  '<div class="sc-frame">'+
  '<div class="sc-inner">'+
  '<div class="sc-left">'+
  '<div><div class="sc-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="#7C3AED"><path d="M12 2l2.4 7.2H22l-6 4.8 2.4 7.2L12 16.8 5.6 21.2 8 14 2 9.2h7.6z"/></svg> HopeForUs</div>'+
  '<div class="sc-title">'+esc(c.title)+'</div></div>'+
  '<div class="sc-org">Organized for<strong>'+esc(c.beneficiary||c.organizer||"")+'</strong></div>'+
  '</div>'+
  '<div class="sc-right">'+(img?'<img src="'+img+'" alt="">':'')+
  '<div class="sc-heart"><svg width="18" height="18" viewBox="0 0 24 24" fill="#7C3AED"><path d="M12 21s-7-4.35-9.5-8.5C.5 9 2.5 5 6.5 5c2 0 3.5 1.2 5.5 3.2C14 6.2 15.5 5 17.5 5c4 0 6 4 4 7.5C19 16.65 12 21 12 21z"/></svg></div>'+
  '<div class="sc-overlay">'+
  '<div class="sc-pct"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="22" fill="none" stroke="#e5e7eb" stroke-width="5"/><circle cx="28" cy="28" r="22" fill="none" stroke="#7C3AED" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+scCirc.toFixed(1)+'" stroke-dashoffset="'+scOff.toFixed(1)+'"/></svg><span>'+p+'%</span></div>'+
  '<span class="sc-raised">'+money(raised,c.currency)+' raised</span>'+
  '<span class="sc-donow">Donate now!</span>'+
  '</div></div></div>'+
  '<div class="sc-icons">'+
  '<button type="button" class="ic-copy" id="scCopy" title="Copy link"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 8h6v6M8 14H5a2 2 0 01-2-2V5a2 2 0 012-2v3"/></svg></button>'+
  '<a class="ic-fb" href="https://www.facebook.com/sharer/sharer.php?u='+shareEnc+'" target="_blank" rel="noopener" title="Facebook"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.04v-2.66c0-3.02 1.79-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.95h-1.51c-1.49 0-1.95.93-1.95 1.89v2.28h3.32l-.53 3.49h-2.79V24C19.61 23.09 24 18.1 24 12.07z"/></svg></a>'+
  '<a class="ic-wa" href="https://wa.me/?text='+shareEnc+'" target="_blank" rel="noopener" title="WhatsApp"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 2.12.55 4.12 1.52 5.85L.05 24l6.34-1.66A11.94 11.94 0 0012 24c6.63 0 12-5.37 12-12S18.63 0 12 0zm5.15 16.4c-.25.7-1.44 1.32-2.01 1.41-.51.08-1.16.11-1.87-.12-.43-.14-.98-.33-1.69-.63-2.98-1.29-4.93-4.29-5.08-4.49-.15-.2-1.22-1.61-1.22-3.07 0-1.46.77-2.18 1.04-2.48.28-.3.6-.37.8-.37h.57c.18 0 .43-.08.67.5.25.59.85 2.05.92 2.2.07.15.12.32.02.52-.1.2-.15.33-.3.5-.15.17-.32.39-.45.52-.15.14-.3.3-.13.6.17.29.76 1.26 1.64 2.04 1.13 1.01 2.08 1.32 2.38 1.47.29.15.47.13.64-.07.17-.2.74-.86.94-1.16.2-.3.4-.25.67-.15.27.09 1.73.81 2.03.96.3.15.5.22.57.35.08.12.08.71-.17 1.41z"/></svg></a>'+
  '<a class="ic-ms" href="https://www.facebook.com/dialog/send?link='+shareEnc+'&app_id=291494419107518&redirect_uri='+shareEnc+'" target="_blank" rel="noopener" title="Messenger"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 4.97 0 11.11c0 3.5 1.72 6.62 4.41 8.65V24l4.04-2.22c1.1.3 2.27.47 3.55.47 6.63 0 12-4.97 12-11.11S18.63 0 12 0zm1.2 15l-3.06-3.26L4.5 15l6.55-6.95L14.2 11.3 19.5 9l-6.3 6z"/></svg></a>'+
  '<a class="ic-li" href="https://www.linkedin.com/sharing/share-offsite/?url='+shareEnc+'" target="_blank" rel="noopener" title="LinkedIn"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 110-4.12 2.06 2.06 0 010 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.23 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.73V1.73C24 .77 23.21 0 22.23 0z"/></svg></a>'+
  '</div></div></div>';
var html='<div class="main">'+
  (img?'<div class="hero-img"><img src="'+img+'" alt=""></div>':'')+
  '<h1>'+esc(c.title)+'</h1>'+
  '<div class="section"><div class="story" id="story">'+esc(story)+'</div>'+(story.length>400?'<button type="button" class="read-more" id="readMore">Read more</button>':'')+'</div>'+
  shareCard+
  '<p style="margin:16px 0 8px;font-size:.85rem"><a href="/report?id='+encodeURIComponent(c.id)+'" style="color:#6b7280;text-decoration:underline">Report this campaign</a></p>'+
  (donors?'<div class="section"><h3>'+(c.donations||donorsArr.length)+' donations</h3><div class="donors">'+donors+'</div></div>':'')+
  '</div>'+
  '<aside class="side"><div class="card">'+
  '<div class="raise-row"><div class="ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#e8e8e8" stroke-width="6"/><circle cx="32" cy="32" r="26" fill="none" stroke="#7C3AED" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+ringCirc.toFixed(1)+'" stroke-dashoffset="'+ringOff.toFixed(1)+'"/></svg><div class="ring-pct">'+p+'%</div></div>'+
  '<div class="raise-meta"><div class="raised">'+money(raised,c.currency)+' raised <span>of '+moneyShort(goal,c.currency)+'</span></div>'+
  '<div class="recent-line">'+recentTxt+'</div></div></div>'+
  '<div class="btn-row">'+donateBtn+
  '<button type="button" class="btn-share" id="shareBtn">Share</button></div>'+
  reviewNote+
  '</div></aside>';
document.getElementById("app").innerHTML=html;
var rm=document.getElementById("readMore");
if(rm){var st=document.getElementById("story");st.classList.add("clamp");rm.onclick=function(){st.classList.toggle("clamp");rm.textContent=st.classList.contains("clamp")?"Read more":"Show less";};}

function showToast(msg){
  var t=document.getElementById("copyToast");
  if(!t)return;
  t.textContent=msg||"Link copied";
  t.classList.add("on");
  setTimeout(function(){t.classList.remove("on");},1600);
}
function copyLink(){
  function ok(){showToast("Link copied");}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(shareUrl).then(ok).catch(function(){
      var ta=document.createElement("textarea");ta.value=shareUrl;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(e){}document.body.removeChild(ta);
    });
  }else{
    var ta=document.createElement("textarea");ta.value=shareUrl;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(e){}document.body.removeChild(ta);
  }
}
var sc=document.getElementById("scCopy");
if(sc)sc.onclick=copyLink;
var shareBtn=document.getElementById("shareBtn");
if(shareBtn)shareBtn.onclick=copyLink;
})();
</script>
<div class="copy-toast" id="copyToast">Link copied</div>
</body>
</html>
