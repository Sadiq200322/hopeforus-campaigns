<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Campaign – HopeForUs</title>
<link rel="stylesheet" href="style.css">
<style>
:root{--lime:#d4f54a;--dark:#0c3d30;--g:#02a95c;--black:#1a1a1a;--muted:#5c5c5c}
body{margin:0;background:#fff;font-family:Inter,-apple-system,sans-serif}
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);border-bottom:1px solid #eee;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.top a.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--black);font-weight:800;font-size:1.1rem}
.top .mark{width:28px;height:28px;background:var(--g);border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.top .signup{background:var(--g);color:#fff;border-radius:999px;padding:8px 14px;text-decoration:none;font-weight:600;font-size:.9rem}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 110px}
.title{font-size:clamp(1.45rem,4vw,2rem);font-weight:800;letter-spacing:-.03em;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr;gap:24px;align-items:start}
@media(min-width:900px){.grid{grid-template-columns:1fr 340px;gap:32px}.sticky{position:sticky;top:72px}}
.gallery{position:relative;border-radius:16px;overflow:hidden;background:#e8e8e8;aspect-ratio:16/10}
.gallery img,.gallery video{width:100%;height:100%;object-fit:cover;display:block}
.gallery .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;padding:20px;text-align:center}
.gallery .dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.gallery .dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
.gallery .dots span.on{background:#fff}
.gallery .nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.92);cursor:pointer;font-size:1.2rem}
.gallery .nav-btn.prev{left:10px}.gallery .nav-btn.next{right:10px}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.thumbs button{flex:0 0 64px;height:48px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:#eee}
.thumbs button.on{border-color:var(--g)}
.thumbs img,.thumbs video{width:100%;height:100%;object-fit:cover}
.org-row{display:flex;align-items:center;gap:12px;margin-top:14px;padding-bottom:12px;border-bottom:1px solid #eee}
.av{width:40px;height:40px;border-radius:50%;background:#e8e8e8;display:flex;align-items:center;justify-content:center;font-weight:700;color:#555}
.badge{display:inline-flex;align-items:center;gap:6px;background:#e8f4fc;color:#1a6a9a;font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:8px;margin:12px 0 16px}
.story{line-height:1.65}.story.collapsed{max-height:160px;overflow:hidden;position:relative}
.story.collapsed:after{content:'';position:absolute;bottom:0;left:0;right:0;height:50px;background:linear-gradient(transparent,#fff)}
.read-more{background:none;border:none;color:var(--g);font-weight:700;cursor:pointer;padding:0;margin:8px 0 16px;font-family:inherit}
.mid{display:flex;gap:10px;margin:8px 0 24px}
.mid button{flex:1;padding:14px;border-radius:999px;font-weight:700;font-family:inherit;cursor:pointer;border:1.5px solid #d1d5db;background:#fff}
.sec{font-size:1.1rem;font-weight:800;margin:24px 0 12px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.raised-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ring{position:relative;width:52px;height:52px}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800}
.amt{font-size:1.4rem;font-weight:800;line-height:1.15}
.goal,.count{font-size:.85rem;color:var(--muted)}
.btn-d{display:block;width:100%;padding:15px;background:var(--lime);color:#111;border:none;border-radius:999px;font-weight:800;font-size:1.05rem;font-family:inherit;cursor:pointer;margin-bottom:8px}
.btn-s{display:block;width:100%;padding:15px;background:var(--dark);color:#c8f0a8;border:none;border-radius:999px;font-weight:800;font-size:1.05rem;font-family:inherit;cursor:pointer}
.share-p{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #eee}
.share-p.open{display:block}
.copy-r{display:flex;gap:8px}
.copy-r input{flex:1;padding:10px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:.85rem}
.copy-r button{padding:10px 12px;border-radius:10px;border:1.5px solid #e5e7eb;background:#fff;font-weight:600;cursor:pointer;font-family:inherit;font-size:.85rem}
.toast{font-size:.8rem;color:var(--g);font-weight:600;margin-top:6px;opacity:0}.toast.show{opacity:1}
.share-s{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.share-s a{flex:1;min-width:64px;text-align:center;padding:10px;border-radius:10px;border:1px solid #e5e7eb;text-decoration:none;color:#111;font-size:.8rem;font-weight:600}
.mbar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid #eee;padding:12px 16px;gap:10px;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.mbar button{flex:1;padding:14px;border-radius:999px;border:none;font-weight:800;font-family:inherit;cursor:pointer}
.mbar .md{background:var(--lime)}.mbar .ms{background:var(--dark);color:#c8f0a8}
@media(max-width:899px){.mbar{display:flex}.card .btn-d,.card .btn-s{display:none}}
.modal-o{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:16px}
.modal-o.open{display:flex}
.modal{background:#fff;border-radius:18px;padding:24px;max-width:400px;width:100%;position:relative}
.modal-x{position:absolute;top:10px;right:12px;border:none;background:none;font-size:1.4rem;cursor:pointer}
.warn{background:#fff8e6;border:1px solid #f5d78e;border-radius:12px;padding:12px;font-size:.88rem;color:#7a5b00;margin-bottom:12px;line-height:1.45}
.cb{background:#f3f4f6;border-radius:12px;padding:14px;text-align:center;margin-bottom:14px}
.cb .l{font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.cb .c{font-size:1.2rem;font-weight:800;letter-spacing:.05em;font-family:ui-monospace,monospace}
.pulse{width:52px;height:52px;margin:0 auto 10px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;animation:pulse 1s ease infinite;color:#fff;font-size:1.4rem}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.owner-bar{background:#e6f7ef;border:1px solid #b3e6cc;border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.owner-bar button,.owner-bar a{padding:8px 12px;border-radius:999px;font-weight:600;font-size:.85rem;font-family:inherit;cursor:pointer;text-decoration:none;border:1.5px solid #d1d5db;background:#fff;color:#111}
.owner-bar a{background:var(--dark);color:#c8f0a8;border:none}
.edit-panel{display:none;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:16px}
.edit-panel.open{display:block}
.edit-panel label{display:block;font-size:.85rem;font-weight:600;margin:8px 0 4px}
.edit-panel input,.edit-panel textarea{width:100%;padding:11px;border:1.5px solid #e5e7eb;border-radius:10px;font-family:inherit;box-sizing:border-box}
.ubox{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:12px}
.ubox textarea{width:100%;min-height:70px;padding:10px;border:1.5px solid #e5e7eb;border-radius:10px;font-family:inherit;box-sizing:border-box}
.upd{padding:12px 0;border-bottom:1px solid #eee}
.upd .dt{font-size:.8rem;color:var(--muted);font-weight:600}
.empty-donors{font-size:.9rem;color:var(--muted);padding:8px 0}
.drow{display:flex;gap:10px;padding:8px 0;align-items:center}
.dav{width:32px;height:32px;border-radius:50%;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem}
</style>
</head>
<body>
<header class="top">
<a href="index.html" class="logo"><span class="mark">H</span> HopeForUs</a>
<a href="signup.html" class="signup">Sign up</a>
</header>
<div class="wrap" id="page"><p style="color:#888;padding:40px 0">Loading…</p></div>
<div class="mbar" id="mbar" style="display:none">
<button type="button" class="md" id="mDonate">Donate now</button>
<button type="button" class="ms" id="mShare">Share</button>
</div>
<div class="modal-o" id="donateModal">
<div class="modal">
<button class="modal-x" id="modalClose" type="button">&times;</button>
<div id="donateStep1">
<h3 id="modalTitle" style="margin:0 0 10px;font-weight:800">Donate</h3>
<div class="warn"><strong style="display:block;margin-bottom:4px">Important</strong>Add the campaign code in the <em>message</em> field on the next page so your gift is linked here.</div>
<div class="cb"><div class="l">Campaign code</div><div class="c" id="modalCode">—</div></div>
<button type="button" class="btn-d" id="continueDonate" style="margin:0">Continue to donate</button>
</div>
<div id="donateStep2" style="display:none;text-align:center;padding:8px 0">
<div class="pulse">♥</div>
<p style="font-weight:700;margin:0 0 6px">Taking you to donate…</p>
<p style="font-size:.85rem;color:#5c5c5c;margin:0 0 10px">Paste your code in the message box.</p>
<div class="cb"><div class="c" id="modalCode2">—</div></div>
</div>
</div>
</div>
<script src="camp-auth.js"></script>
<script>
function getId(){return new URLSearchParams(location.search).get('id')||''}
function getList(){try{return JSON.parse(localStorage.getItem('hopeforus_campaigns')||'[]')}catch(e){return[]}}
function saveList(list){localStorage.setItem('hopeforus_campaigns',JSON.stringify(list))}
function findC(id){var list=getList();for(var i=0;i<list.length;i++)if(list[i].id===id)return{c:list[i],list:list};return null}
function pct(r,g){return g?Math.min(100,Math.round(r/g*100)):0}
function dash(p){return 150.8-(150.8*p/100)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(iso){try{return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}catch(e){return''}}
var id=getId(),found=findC(id),user=JSON.parse(localStorage.getItem('hopeforus_user')||'null'),updatePhoto=null,gIdx=0,gItems=[];
if(!found){document.getElementById('page').innerHTML='<p style="padding:40px 0">Campaign not found. <a href="index.html">Home</a></p>'}else{render(found)}
function openDonate(){document.getElementById('donateStep1').style.display='block';document.getElementById('donateStep2').style.display='none';document.getElementById('donateModal').classList.add('open')}
function openShare(){var p=document.getElementById('sharePanel');if(p){p.classList.add('open');p.scrollIntoView({behavior:'smooth',block:'nearest'})}}
function render(found){
var c=found.c;document.title=c.title+' – HopeForUs';
var raised=Number(c.raised)||0,goal=Number(c.goal)||1,p=pct(raised,goal);
var isOwner=user&&(user.email===c.ownerEmail||user.name===c.organizer);
var realDonors=c.donors||[];
gItems=[];
if(c.cover&&c.cover.dataUrl)gItems.push(c.cover);
else if(c.image)gItems.push({type:'image',dataUrl:c.image});
if(c.media)c.media.forEach(function(m){if(m&&m.dataUrl)gItems.push(m)});
if(gIdx>=gItems.length)gIdx=0;
var cover=gItems.length?(function(){var g=gItems[gIdx];return(g.type&&g.type.indexOf('video')===0)?'<video src="'+g.dataUrl+'" controls playsinline style="width:100%;height:100%;object-fit:cover"></video>':'<img src="'+g.dataUrl+'" alt="">'})():'<div class="ph" style="background:linear-gradient(135deg,#02a95c,#016b3a)">'+esc((c.title||'').slice(0,40))+'</div>';
var dots='',nav='',thumbs='';
if(gItems.length>1){
dots='<div class="dots">'+gItems.map(function(_,i){return '<span class="'+(i===gIdx?'on':'')+'"></span>'}).join('')+'</div>';
nav='<button type="button" class="nav-btn prev" id="galPrev">‹</button><button type="button" class="nav-btn next" id="galNext">›</button>';
thumbs='<div class="thumbs" id="thumbs">'+gItems.map(function(m,i){var inn=(m.type&&m.type.indexOf('video')===0)?'<video src="'+m.dataUrl+'" muted></video>':'<img src="'+m.dataUrl+'" alt="">';return '<button type="button" class="'+(i===gIdx?'on':'')+'" data-i="'+i+'">'+inn+'</button>'}).join('')+'</div>';
}
var storyFull=esc(c.story||'').replace(/\n/g,'</p><p>');
var updates=c.updates||[];
var uHtml=updates.length?updates.slice().reverse().map(function(u){var m='';if(u.photo&&u.photo.dataUrl)m=(u.photo.type&&u.photo.type.indexOf('video')===0)?'<video src="'+u.photo.dataUrl+'" controls style="max-width:100%;max-height:240px;border-radius:12px;margin-top:10px"></video>':'<img src="'+u.photo.dataUrl+'" style="max-width:100%;max-height:240px;border-radius:12px;margin-top:10px">';return '<div class="upd"><div class="dt">'+esc(fmt(u.date))+'</div><div>'+esc(u.text)+'</div>'+m+'</div>'}).join(''):'<p style="color:#888;font-size:.9rem">No updates yet.</p>';
var postBox=isOwner?'<div class="ubox"><strong style="display:block;margin-bottom:8px">Post an update</strong><textarea id="updateText" placeholder="Write an update…"></textarea><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><label style="cursor:pointer;font-weight:600;font-size:.85rem;color:#02a95c">+ Photo / video<input type="file" id="updatePhotoInput" accept="image/*,video/*" hidden></label><button type="button" id="postUpdateBtn" style="padding:8px 14px;border-radius:999px;border:none;background:#0c3d30;color:#c8f0a8;font-weight:700;cursor:pointer;font-family:inherit">Share update</button></div><div id="updatePhotoPreview"></div></div>':'';
var donorsHtml='';
if(raised>0&&realDonors.length){
donorsHtml='<div style="font-weight:700;color:#7c3aed;margin:16px 0 8px">'+realDonors.length+' recent donations</div>'+realDonors.map(function(d){return '<div class="drow"><div class="dav">'+(d.name||'A').charAt(0)+'</div><div><strong>'+esc(d.name||'Anonymous')+'</strong><div style="font-size:.8rem;color:#5c5c5c">$'+(d.amount||0)+'</div></div></div>'}).join('');
}else if(raised>0){
donorsHtml='<p class="empty-donors">Donations coming in!</p>';
}else{
donorsHtml='<p class="empty-donors">No donations yet.</p>';
}
var ownerBar='';
if(isOwner){
ownerBar='<div class="owner-bar"><strong style="font-size:.9rem">You own this campaign</strong><button type="button" id="editBtn">Edit</button><a href="dashboard.html#withdraw">Withdraw</a></div>'+
'<div class="edit-panel" id="editPanel"><label>Title</label><input id="editTitle" value="'+esc(c.title)+'"><label>Goal ($)</label><input type="number" id="editGoal" min="1" value="'+goal+'"><label>Starting / current raised ($)</label><input type="number" id="editRaised" min="0" value="'+raised+'"><label>Story</label><textarea id="editStory" rows="3">'+esc(c.story||'')+'</textarea><button type="button" class="btn-d" id="saveEdit" style="margin-top:10px">Save changes</button></div>';
}
var link=location.href.split('#')[0];
var fb='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(link);
var tw='https://twitter.com/intent/tweet?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(c.title);
var wa='https://wa.me/?text='+encodeURIComponent(c.title+' '+link);
document.getElementById('page').innerHTML=ownerBar+'<h1 class="title">'+esc(c.title)+'</h1><div class="grid"><div>'+
'<div class="gallery">'+cover+dots+nav+'</div>'+thumbs+
'<div class="org-row"><div class="av">'+(c.organizer||'O').charAt(0).toUpperCase()+'</div><div style="font-weight:700">'+esc(c.organizer||'Organizer')+'</div></div>'+
'<div class="badge">🛡 Donation protected</div>'+
'<div class="story collapsed" id="storyBlock"><p>'+storyFull+'</p></div>'+
'<button type="button" class="read-more" id="readMore">Read more</button>'+
'<div class="mid"><button type="button" id="midDonate">Donate</button><button type="button" id="midShare">Share</button></div>'+
'<div class="sec">Updates</div>'+postBox+uHtml+
'</div><aside class="sticky"><div class="card">'+
'<div class="raised-row"><div class="ring"><svg width="52" height="52" viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" fill="none" stroke="#e5e7eb" stroke-width="5"/><circle cx="28" cy="28" r="24" fill="none" stroke="#02a95c" stroke-width="5" stroke-dasharray="150.8" stroke-dashoffset="'+dash(p)+'" stroke-linecap="round"/></svg><span class="pct">'+p+'%</span></div>'+
'<div><div class="amt">$'+raised.toLocaleString()+' raised</div><div class="goal">of $'+goal.toLocaleString()+'</div><div class="count">'+(raised>0?'Campaign active':'Be the first donor')+'</div></div></div>'+
'<button type="button" class="btn-d" id="sideDonate">Donate now</button>'+
'<button type="button" class="btn-s" id="sideShare">Share</button>'+
'<div class="share-p" id="sharePanel"><div class="copy-r"><input id="campaignLink" readonly value="'+esc(link)+'"><button type="button" id="copyBtn">Copy</button></div><div class="toast" id="copyToast">Copied!</div>'+
'<div class="share-s"><a href="'+fb+'" target="_blank" rel="noopener">Facebook</a><a href="'+tw+'" target="_blank" rel="noopener">X</a><a href="'+wa+'" target="_blank" rel="noopener">WhatsApp</a></div></div>'+
donorsHtml+'</div></aside></div>';
document.getElementById('modalTitle').textContent='Donate to '+c.title;
document.getElementById('modalCode').textContent=c.code||'—';
document.getElementById('modalCode2').textContent=c.code||'—';
document.getElementById('mbar').style.display=window.innerWidth<900?'flex':'none';
['sideDonate','midDonate','mDonate'].forEach(function(x){var el=document.getElementById(x);if(el)el.onclick=openDonate});
['sideShare','midShare','mShare'].forEach(function(x){var el=document.getElementById(x);if(el)el.onclick=openShare});
document.getElementById('modalClose').onclick=function(){document.getElementById('donateModal').classList.remove('open')};
document.getElementById('donateModal').onclick=function(e){if(e.target===this)this.classList.remove('open')};
document.getElementById('continueDonate').onclick=function(){
document.getElementById('donateStep1').style.display='none';
document.getElementById('donateStep2').style.display='block';
try{navigator.clipboard.writeText(c.code||'')}catch(e){}
setTimeout(function(){window.open('https://kickbot.com/tips/HopeForUs','_blank','noopener')},900);
};
document.getElementById('copyBtn').onclick=function(){navigator.clipboard.writeText(link).then(function(){var t=document.getElementById('copyToast');t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)})};
document.getElementById('readMore').onclick=function(){document.getElementById('storyBlock').classList.remove('collapsed');this.style.display='none'};
if(gItems.length>1){
document.getElementById('galPrev').onclick=function(){gIdx=(gIdx-1+gItems.length)%gItems.length;render(findC(id))};
document.getElementById('galNext').onclick=function(){gIdx=(gIdx+1)%gItems.length;render(findC(id))};
document.getElementById('thumbs').onclick=function(e){var b=e.target.closest('button[data-i]');if(!b)return;gIdx=+b.dataset.i;render(findC(id))};
}
if(isOwner){
document.getElementById('editBtn').onclick=function(){document.getElementById('editPanel').classList.toggle('open')};
document.getElementById('saveEdit').onclick=function(){
var f=findC(id);if(!f)return;
f.c.title=document.getElementById('editTitle').value.trim()||f.c.title;
f.c.goal=parseInt(document.getElementById('editGoal').value,10)||f.c.goal;
f.c.raised=Math.max(0,parseInt(document.getElementById('editRaised').value,10)||0);
f.c.story=document.getElementById('editStory').value.trim()||f.c.story;
saveList(f.list);render(findC(id));
};
var pi=document.getElementById('updatePhotoInput');
if(pi)pi.onchange=function(){var f=pi.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){updatePhoto={type:f.type,dataUrl:e.target.result};document.getElementById('updatePhotoPreview').innerHTML='<img src="'+e.target.result+'" style="max-width:160px;max-height:100px;border-radius:8px;margin-top:6px">'};r.readAsDataURL(f)};
var pb=document.getElementById('postUpdateBtn');
if(pb)pb.onclick=function(){var text=document.getElementById('updateText').value.trim();if(!text)return;var f=findC(id);if(!f)return;if(!f.c.updates)f.c.updates=[];f.c.updates.push({text:text,date:new Date().toISOString(),photo:updatePhoto});try{saveList(f.list)}catch(err){f.c.updates[f.c.updates.length-1].photo=null;saveList(f.list)}updatePhoto=null;render(findC(id))}
}
}
window.addEventListener('resize',function(){var mb=document.getElementById('mbar');if(mb)mb.style.display=window.innerWidth<900?'flex':'none'});
</script>
</body>
</html>
