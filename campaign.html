<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Campaign – HopeForUs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;background:#f7f7f5;color:#1a1a1a;line-height:1.5}
    .hdr{position:sticky;top:0;z-index:50;height:56px;background:rgba(255,255,255,.98);border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
    .logo{display:inline-flex;align-items:center;gap:8px;font-weight:800;text-decoration:none;color:#1a1a1a}
    .logo img{width:26px;height:26px}
    .back{font-size:.9rem;font-weight:600;color:#7C3AED;text-decoration:none}
    .wrap{max-width:960px;margin:0 auto;padding:20px 16px 100px}
    .title{font-size:1.6rem;font-weight:800;margin:0 0 12px;line-height:1.25}
    .hero{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;background:#e5e5e5;margin-bottom:16px}
    .layout{display:grid;gap:24px}
    @media(min-width:800px){.layout{grid-template-columns:1fr 320px;align-items:start}}
    .story h2{font-size:1.1rem;margin:20px 0 8px}
    .story p{color:#444;margin-bottom:12px;white-space:pre-wrap}
    .org{display:flex;align-items:center;gap:12px;margin:16px 0}
    .av{width:44px;height:44px;border-radius:50%;background:#7C3AED;color:#fff;display:grid;place-items:center;font-weight:800}
    .card{background:#fff;border:1px solid #e8e8e8;border-radius:18px;padding:20px}
    @media(min-width:800px){.card{position:sticky;top:72px}}
    .raised{font-size:1.75rem;font-weight:800}
    .goal{color:#666;font-size:.95rem;margin-bottom:8px}
    .bar{height:8px;background:#ececec;border-radius:99px;overflow:hidden;margin:10px 0}
    .bar i{display:block;height:100%;background:#02a95c;border-radius:99px}
    .dons{font-size:.9rem;color:#555;margin-bottom:14px}
    .btn{display:block;width:100%;text-align:center;padding:14px;border-radius:999px;font-weight:700;text-decoration:none;border:0;cursor:pointer;font-size:1rem;margin-bottom:10px;font-family:inherit}
    .btn-p{background:#7C3AED;color:#fff}
    .btn-s{background:#1a1a1a;color:#fff}
    .btn-o{background:#fff;color:#1a1a1a;border:1.5px solid #ddd}
    .card-donors{margin-top:14px;border-top:1px solid #f0f0f0;padding-top:12px}
    .card-donors h3{font-size:.85rem;font-weight:700;margin-bottom:8px;color:#444}
    .donor{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0}
    .donor:last-child{border:0}
    .dot{width:36px;height:36px;border-radius:50%;background:#ede9fe;color:#7C3AED;display:grid;place-items:center;font-weight:800;flex-shrink:0;font-size:.9rem}
    .amt{font-weight:700;font-size:.95rem}
    .note{font-size:.85rem;color:#666}
    .empty{padding:40px 20px;text-align:center;color:#666}
    .mobile-bar{display:none}
    @media(max-width:799px){
      .mobile-bar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.98);border-top:1px solid #e8e8e8;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
      .mobile-bar .btn{margin:0}
      .card .btn-p{display:none}
    }
  </style>
</head>
<body>
  <header class="hdr">
    <a href="/" class="logo"><img src="/logo-mark.svg" alt=""> HopeForUs</a>
    <a href="/" class="back">← Discover</a>
  </header>
  <div class="wrap" id="app">
    <p class="empty">Loading campaign…</p>
  </div>
  <div class="mobile-bar" id="mobileBar" style="display:none"></div>
  <script src="campaigns-data.js?v=15"></script>
  <script src="supabase.js?v=15"></script>
  <script src="shared-camps.js?v=15"></script>
  <script src="app.js?v=15"></script>
  <script>
  (function(){
    var params = new URLSearchParams(location.search);
    var id = (params.get('id') || '').trim();
    var shareCode = (params.get('code') || '').toUpperCase().trim();
    var app = document.getElementById('app');
    var mobileBar = document.getElementById('mobileBar');
    var KNOWN = { 'EEPBA7': 'c_mvs4qsny', 'VY84Q4': 'c_mvs9eg5p' };
    if(KNOWN[id.toUpperCase()]){
      shareCode = shareCode || id.toUpperCase();
      id = KNOWN[id.toUpperCase()];
    }
    if(!id){
      app.innerHTML = '<p class="empty">No campaign selected. <a href="/">Back to home</a></p>';
      return;
    }

    function esc(s){
      var a = String.fromCharCode(38);
      return String(s==null?'':s)
        .replace(/&/g, a+'amp;')
        .replace(/</g, a+'lt;')
        .replace(/>/g, a+'gt;')
        .replace(/"/g, a+'quot;')
        .replace(/'/g, '&#39;');
    }
    function money(n,c){ n=Number(n)||0; var s=n.toLocaleString(); return (c==='EUR'?'€':c==='GBP'?'£':'$')+s; }
    function shortUrl(code){
      code = (code || shareCode || id || '').toString().toUpperCase();
      if(window.HF && HF.shortLink) return HF.shortLink(code);
      return (location.origin || 'https://munowatchplus.watch') + '/c/' + encodeURIComponent(code);
    }

    function findLocal(){
      try{
        var list = JSON.parse(localStorage.getItem('hopeforus_campaigns')||'[]');
        if(!Array.isArray(list)) list=[];
        var c = list.find(function(x){
          if(!x) return false;
          if(x.id===id) return true;
          if(String(x.code||'').toUpperCase()===id.toUpperCase()) return true;
          if(shareCode && String(x.code||'').toUpperCase()===shareCode) return true;
          return false;
        });
        if(c) return c;
      }catch(e){}
      if(typeof SAMPLES !== 'undefined' && Array.isArray(SAMPLES)){
        var s = SAMPLES.find(function(x){ return x && x.id===id; });
        if(s) return Object.assign({}, s, {status: s.status||'approved'});
      }
      if(window.HF && HF.findCampaign){
        var f = HF.findCampaign(id);
        if(f && f.campaign) return f.campaign;
      }
      return null;
    }

    function maxRaised(a, b){
      var ra = Number(a && a.raised)||0;
      var rb = Number(b && b.raised)||0;
      var da = Number(a && a.donations)||0;
      var db = Number(b && b.donations)||0;
      return {
        raised: Math.max(ra, rb),
        donations: Math.max(da, db),
        donors: (a && a.donors && a.donors.length) ? a.donors : (b && b.donors) || []
      };
    }

    function donorRows(donors, limit){
      return (donors||[]).slice(0, limit||8).map(function(d){
        var name = d.name || d.donor || 'Anonymous';
        var amt = Number(d.amount)||0;
        var note = d.note || d.time || '';
        return '<div class="donor"><div class="dot">'+esc(name.charAt(0).toUpperCase())+'</div><div><div class="amt">'+esc(name)+' · '+money(amt,d.currency||'')+'</div>'+(note?'<div class="note">'+esc(note)+'</div>':'')+'</div></div>';
      }).join('') || '<p class="note">No public donations yet.</p>';
    }

    function paint(c){
      if(!c){
        app.innerHTML = '<p class="empty">Campaign not found. <a href="/">Back to home</a></p>';
        if(mobileBar) mobileBar.style.display='none';
        return;
      }
      var raised = Number(c.raised)||0;
      var goal = Math.max(1, Number(c.goal)||1);
      var pct = Math.min(100, Math.round(raised/goal*100));
      var img = c.image || (c.media && c.media[0] && (c.media[0].dataUrl||c.media[0].url)) || 'https://images.unsplash.com/photo-1532629345422-7515f3d16bb6?w=900&h=500&fit=crop&auto=format&q=70';
      var org = c.organizer || 'Organizer';
      if(String(org).indexOf('@')>=0) org = String(org).split('@')[0];
      var donors = Array.isArray(c.donors) ? c.donors : [];
      var donateHref = c.donationLink || ('donate.html?id='+encodeURIComponent(c.id));
      var donorHtml = donorRows(donors, 8);
      var code = (c.code || shareCode || '').toString().toUpperCase();

      document.title = (c.title || 'Campaign') + ' – HopeForUs';
      app.innerHTML =
        '<h1 class="title">'+esc(c.title||'Untitled')+'</h1>'+
        '<img class="hero" src="'+esc(img)+'" alt="" onerror="this.src=\'https://images.unsplash.com/photo-1532629345422-7515f3d16bb6?w=900&h=500&fit=crop&auto=format&q=70\'">'+
        '<div class="layout">'+
          '<aside class="card">'+
            '<div class="raised">'+money(raised,c.currency)+'</div>'+
            '<div class="goal">raised of '+money(goal,c.currency)+' goal</div>'+
            '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
            '<div class="dons">'+(Number(c.donations)||donors.length||0)+' donations</div>'+
            '<a class="btn btn-p" id="donateTop" href="'+esc(donateHref)+'" '+(c.donationLink?'target="_blank" rel="noopener"':'')+'>Donate now</a>'+
            '<button type="button" class="btn btn-s" id="shareBtn">Share</button>'+
            '<div class="card-donors"><h3>Recent donations</h3>'+donorHtml+'</div>'+
          '</aside>'+
          '<div class="story">'+
            '<div class="org"><div class="av">'+esc(String(org).charAt(0).toUpperCase())+'</div><div><strong>'+esc(org)+'</strong><div class="note">'+(c.category||'Fundraiser')+(c.status==='pending'?' · Pending approval':'')+'</div></div></div>'+
            '<h2>Story</h2><p>'+esc(c.story||'No story yet.')+'</p>'+
            '<a class="btn btn-o" href="/">More fundraisers</a>'+
          '</div>'+
        '</div>';

      if(mobileBar){
        mobileBar.style.display='block';
        mobileBar.innerHTML = '<a class="btn btn-p" href="'+esc(donateHref)+'" '+(c.donationLink?'target="_blank" rel="noopener"':'')+'>Donate now</a>';
      }

      var shareBtn = document.getElementById('shareBtn');
      if(shareBtn){
        shareBtn.onclick = function(){
          var url = shortUrl(code);
          var text = (c.title||'Support this fundraiser') + ' on HopeForUs';
          if(navigator.share){
            navigator.share({title:c.title, text:text, url:url}).catch(function(){});
          } else if(navigator.clipboard){
            navigator.clipboard.writeText(url).then(function(){ shareBtn.textContent='Link copied!'; setTimeout(function(){shareBtn.textContent='Share';},2000); });
          }
        };
      }
    }

    var local = findLocal();
    paint(local);

    if(window.HFDB && HFDB.one){
      HFDB.one(id).then(function(remote){
        if(!remote) return;
        var base = local || remote;
        var m = maxRaised(local, remote);
        var merged = Object.assign({}, base, {
          raised: m.raised,
          donations: m.donations,
          donors: m.donors.length ? m.donors : (base.donors||[]),
          title: base.title || remote.title,
          story: base.story || remote.story,
          image: base.image || remote.image,
          status: remote.status || base.status,
          donationLink: remote.donationLink || base.donationLink || '',
          organizer: base.organizer || remote.organizer || '',
          code: base.code || remote.code || shareCode || ''
        });
        if(local && m.raised > (Number(local.raised)||0)){
          try{
            var list = JSON.parse(localStorage.getItem('hopeforus_campaigns')||'[]');
            if(Array.isArray(list)){
              var t = list.find(function(x){ return x && x.id===id; });
              if(t){ t.raised = m.raised; t.donations = m.donations; localStorage.setItem('hopeforus_campaigns', JSON.stringify(list)); }
            }
          }catch(e){}
        }
        paint(merged);
      }).catch(function(){});
    }
  })();
  </script>
  <script src="raised-refresh.js?v=3"></script>
</body>
</html>
