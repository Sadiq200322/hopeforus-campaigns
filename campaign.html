<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign – HopeForUs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="share-card.css">
<style>
:root{--p:#7C3AED;--p-dark:#5B21B6;--green:#00a964;--black:#1a1a1a;--muted:#5c5c5c;--border:#e5e5e5;--bg:#f7f7f7;--font:Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font);color:var(--black);background:#fff;line-height:1.5}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}img{max-width:100%;display:block}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:50}
.logo{font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.btn-p{background:var(--p);color:#fff;border:none;font-weight:700;padding:10px 18px;border-radius:999px;font-size:.9rem}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;display:grid;gap:28px}
@media(min-width:900px){.wrap{grid-template-columns:1fr 340px;align-items:start}}
.main h1{font-size:clamp(1.4rem,3vw,1.85rem);font-weight:800;line-height:1.2;margin-bottom:12px}
.hero-img{width:100%;border-radius:16px;overflow:hidden;margin-bottom:16px;background:#eee;aspect-ratio:16/10}
.hero-img img{width:100%;height:100%;object-fit:cover}
.section{margin:24px 0}.section h3{font-size:1.05rem;font-weight:800;margin-bottom:10px}
.story{font-size:.95rem;color:#333;line-height:1.65;white-space:pre-wrap}
.story.clamp{-webkit-line-clamp:6;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.read-more{background:none;border:none;color:var(--p);font-weight:700;font-size:.9rem;margin-top:8px;padding:0}
.side{position:sticky;top:80px}
.card{border:1px solid var(--border);border-radius:20px;padding:18px;background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.06)}
.raise-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ring{width:64px;height:64px;flex-shrink:0;position:relative}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;color:#111}
.raise-meta{flex:1;min-width:0}
.raised{font-size:1.25rem;font-weight:800;line-height:1.2}
.raised span{font-weight:600;color:#6b7280;font-size:1rem}
.recent-line{font-size:.85rem;color:#6b7280;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.btn-donate{display:block;width:100%;background:#c8f542;color:#0a2e0a;border:none;font-weight:800;padding:14px 12px;border-radius:999px;font-size:1rem;text-align:center}
.btn-share{display:block;width:100%;background:#0f3d2e;color:#c8f542;border:none;font-weight:800;padding:14px 12px;border-radius:999px;font-size:1rem;text-align:center}
.donors{margin-top:16px}.donor{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:.88rem}
.donor:last-child{border:0}.d-av{width:36px;height:36px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:.8rem}
@media(max-width:899px){.side{position:static}.card{margin-top:8px}}
.ft{text-align:center;padding:24px;color:var(--muted);font-size:.85rem;border-top:1px solid #eee}
</style>
</head>
<body>
<header class="hdr"><a href="index.html" class="logo">HopeForUs</a><a href="create-campaign.html" class="btn-p">Start a HopeForUs</a></header>
<div class="wrap" id="app"><p style="padding:40px;color:#666">Loading campaign…</p></div>
<footer class="ft">© 2026 HopeForUs</footer>
<script src="campaigns-data.js"></script>
<script>
(function(){
function esc(s){var a=String.fromCharCode(38);return String(s||"").replace(/&/g,a+"amp;").replace(/</g,a+"lt;").replace(/>/g,a+"gt;").replace(/"/g,a+"quot;")}
function money(n,c){c=c||"USD";var s=Number(n||0).toLocaleString();return c==="EUR"?"\u20ac"+s:c==="GBP"?"\u00a3"+s:"$"+s}
var params=new URLSearchParams(location.search);
var id=params.get("id")||"";
var list=[];
try{list=JSON.parse(localStorage.getItem("hopeforus_campaigns")||"[]")||[]}catch(e){}
if(!Array.isArray(list))list=[];
var c=null;
for(var i=0;i<list.length;i++){if(list[i]&&list[i].id===id){c=list[i];break}}
if(!c&&typeof SAMPLES!=="undefined"){
  for(var j=0;j<SAMPLES.length;j++){if(SAMPLES[j]&&SAMPLES[j].id===id){c=SAMPLES[j];break}}
}
if(!c){
  document.getElementById("app").innerHTML='<p style="padding:40px">Campaign not found. <a href="index.html" style="color:#7C3AED">Back home</a></p>';
  return;
}
var raised=Number(c.raised)||0,goal=Math.max(1,Number(c.goal)||1);
var p=Math.min(100,Math.round(raised/goal*100));
var story=c.story||"";
var shareUrl=location.href;
var shareEnc=encodeURIComponent(shareUrl);
var donors=(c.donors||[]).slice(0,8).map(function(d){
  var n=(d.name||"A").charAt(0).toUpperCase();
  return '<div class="donor"><div class="d-av">'+n+'</div><div><strong>'+esc(d.name)+'</strong><div style="color:#666">'+money(d.amount,c.currency)+(d.message?' · '+esc(d.message):'')+'</div></div></div>';
}).join("");
var ringCirc=2*Math.PI*26;
var ringOff=ringCirc*(1-Math.min(1,p/100));
var topDonor=(c.donors&&c.donors[0])?c.donors[0]:null;
var recentTxt=topDonor?(esc(topDonor.name||"Someone")+" donated "+money(topDonor.amount,c.currency)):((c.donations||0)+" donations");
var shareCard='<div class="section"><h3>Sharing helps more than you think</h3><p style="font-size:.9rem;color:#5c5c5c;margin-bottom:16px;line-height:1.5">On average, <strong>each share can inspire $50</strong> in donations by helping this fundraiser reach more people.</p>'+
  '<div class="share-card-box" style="background:#f3f4f6;border-radius:16px;padding:16px">'+
  '<div style="display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:12px;padding:12px;margin-bottom:12px">'+
  (c.image?'<img src="'+c.image+'" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:10px;flex-shrink:0">':'')+
  '<div style="min-width:0"><div style="font-weight:800;font-size:.95rem;line-height:1.3;margin-bottom:4px">'+esc(c.title)+'</div>'+
  '<div style="font-size:.8rem;color:#6b7280">Organized for '+esc(c.beneficiary||c.organizer||"")+' · '+p+'% · '+money(raised,c.currency)+' raised</div>'+
  '<div style="display:flex;gap:8px;margin-top:10px">'+
  '<button type="button" id="scCopy" style="width:36px;height:36px;border-radius:50%;border:1px solid #e5e7eb;background:#fff;display:inline-flex;align-items:center;justify-content:center" title="Copy link"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 4h4v4M14 4l-6 6M6 10H4v4h4"/></svg></button>'+
  '</div></div></div>'+
  '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+
  '<a href="https://www.facebook.com/sharer/sharer.php?u='+shareEnc+'" target="_blank" rel="noopener" title="Facebook" style="width:40px;height:40px;border-radius:50%;background:#1877f2;color:#fff;display:inline-flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.04v-2.66c0-3.02 1.79-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.95h-1.51c-1.49 0-1.95.93-1.95 1.89v2.28h3.32l-.53 3.49h-2.79V24C19.61 23.09 24 18.1 24 12.07z"/></svg></a>'+
  '<a href="https://wa.me/?text='+shareEnc+'" target="_blank" rel="noopener" title="WhatsApp" style="width:40px;height:40px;border-radius:50%;background:#25d366;color:#fff;display:inline-flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 2.12.55 4.12 1.52 5.85L.05 24l6.34-1.66A11.94 11.94 0 0012 24c6.63 0 12-5.37 12-12S18.63 0 12 0zm5.15 16.4c-.25.7-1.44 1.32-2.01 1.41-.51.08-1.16.11-1.87-.12-.43-.14-.98-.33-1.69-.63-2.98-1.29-4.93-4.29-5.08-4.49-.15-.2-1.22-1.61-1.22-3.07 0-1.46.77-2.18 1.04-2.48.28-.3.6-.37.8-.37h.57c.18 0 .43-.08.67.5.25.59.85 2.05.92 2.2.07.15.12.32.02.52-.1.2-.15.33-.3.5-.15.17-.32.39-.45.52-.15.14-.3.3-.13.6.17.29.76 1.26 1.64 2.04 1.13 1.01 2.08 1.32 2.38 1.47.29.15.47.13.64-.07.17-.2.74-.86.94-1.16.2-.3.4-.25.67-.15.27.09 1.73.81 2.03.96.3.15.5.22.57.35.08.12.08.71-.17 1.41z"/></svg></a>'+
  '<a href="https://www.linkedin.com/sharing/share-offsite/?url='+shareEnc+'" target="_blank" rel="noopener" title="LinkedIn" style="width:40px;height:40px;border-radius:50%;background:#0a66c2;color:#fff;display:inline-flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 110-4.12 2.06 2.06 0 010 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.23 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.73V1.73C24 .77 23.21 0 22.23 0z"/></svg></a>'+
  '</div></div></div>';
var html='<div class="main">'+
  (c.image?'<div class="hero-img"><img src="'+c.image+'" alt=""></div>':'')+
  '<h1>'+esc(c.title)+'</h1>'+
  '<div class="section"><div class="story" id="story">'+esc(story)+'</div>'+(story.length>400?'<button type="button" class="read-more" id="readMore">Read more</button>':'')+'</div>'+
  shareCard+
  (donors?'<div class="section"><h3>Recent donations</h3><div class="donors">'+donors+'</div></div>':'')+
  '</div>'+
  '<aside class="side"><div class="card">'+
  '<div class="raise-row"><div class="ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#e8e8e8" stroke-width="6"/><circle cx="32" cy="32" r="26" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+ringCirc.toFixed(1)+'" stroke-dashoffset="'+ringOff.toFixed(1)+'"/></svg><div class="ring-pct">'+p+'%</div></div>'+
  '<div class="raise-meta"><div class="raised">'+money(raised,c.currency)+' raised <span>of '+money(goal,c.currency)+'</span></div>'+
  '<div class="recent-line">'+recentTxt+'</div></div></div>'+
  '<div class="btn-row"><button type="button" class="btn-donate" id="donateBtn">Donate</button>'+
  '<button type="button" class="btn-share" id="shareBtn">Share</button></div>'+
  (donors?'<div class="donors">'+donors+'</div>':'')+
  '</div></aside>';
document.getElementById("app").innerHTML=html;
var rm=document.getElementById("readMore");
if(rm){var st=document.getElementById("story");st.classList.add("clamp");rm.onclick=function(){st.classList.toggle("clamp");rm.textContent=st.classList.contains("clamp")?"Read more":"Show less";};}
var sc=document.getElementById("scCopy");
if(sc)sc.onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText(shareUrl).then(function(){alert("Link copied!");});else prompt("Copy link",shareUrl);};
document.getElementById("donateBtn").onclick=function(){alert("Donate flow coming soon");};
document.getElementById("shareBtn").onclick=function(){if(navigator.share)navigator.share({title:c.title,url:shareUrl});else if(navigator.clipboard)navigator.clipboard.writeText(shareUrl).then(function(){alert("Link copied!");});};
})();
</script>
</body>
</html>
