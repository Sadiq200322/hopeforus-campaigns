<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Campaign – HopeForUs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#7C3AED;--p-dark:#4C1D95;--p-light:#EDE9FE;--black:#1a1a1a;--muted:#5c5c5c;--border:#e5e5e5;--font:Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--black);background:#f7f7f5;line-height:1.5}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}img{max-width:100%;display:block}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:50;gap:12px}
.logo{font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:8px;color:#1a1a1a}
.logo img{width:26px;height:26px}
.back{font-size:.9rem;font-weight:600;color:var(--p)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 160px;display:grid;gap:28px}
@media(min-width:900px){.wrap{grid-template-columns:1fr 340px;align-items:start;padding-bottom:40px}}
.main h1{font-size:clamp(1.45rem,3vw,1.9rem);font-weight:800;line-height:1.2;margin:0 0 14px}
.hero-img{width:100%;border-radius:16px;overflow:hidden;margin-bottom:16px;background:#eee;aspect-ratio:16/10}
.hero-img img,.hero-img video{width:100%;height:100%;object-fit:cover}
.section{margin:22px 0}.section h3{font-size:1.05rem;font-weight:800;margin-bottom:8px}
.story{font-size:.98rem;color:#333;line-height:1.65;white-space:pre-wrap}
.story.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.read-more{background:none;border:none;color:var(--p);font-weight:700;font-size:.9rem;margin-top:8px;padding:0}
.org{display:flex;align-items:center;gap:12px;margin:8px 0 16px}
.av{width:44px;height:44px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:800}
.side{position:sticky;top:72px;z-index:30}
.card{border:1px solid var(--border);border-radius:20px;padding:18px;background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.08)}
.raise-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ring{width:64px;height:64px;flex-shrink:0;position:relative}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800}
.raise-meta{flex:1;min-width:0}
.raised{font-size:1.25rem;font-weight:800;line-height:1.2}
.raised span{font-weight:600;color:#6b7280;font-size:1rem}
.recent-line{font-size:.85rem;color:#6b7280;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-donate,.btn-share{display:block;width:100%;border:none;font-weight:800;padding:14px 12px;border-radius:999px;font-size:1rem;text-align:center}
.btn-donate{background:var(--p);color:#fff}
.btn-share{background:var(--p-dark);color:#E9D5FF}
@media(max-width:899px){
  .side{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));top:auto;z-index:60}
  .card{border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:12px 14px}
  .raise-row{margin-bottom:10px}
  .ring{width:48px;height:48px}
  .ring svg{width:48px;height:48px}
  .ring-pct{font-size:.72rem}
  .raised{font-size:1rem}
  .raised span{font-size:.85rem}
}
.donors{margin-top:4px}
.donor{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #eee;font-size:.9rem}
.donor:last-child{border:0}
.d-av{width:36px;height:36px;border-radius:50%;background:var(--p-light);color:var(--p-dark);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.share-promo{margin:28px 0}
.share-promo h3{font-size:1.15rem;font-weight:800;margin-bottom:6px}
.share-promo .sub{font-size:.92rem;color:#5c5c5c;margin-bottom:16px;line-height:1.5;max-width:520px}
.sc-frame{background:#f0f1f3;border-radius:20px;padding:16px}
.sc-inner{background:#fff;border-radius:16px;overflow:hidden;display:grid;grid-template-columns:1.1fr 1fr;min-height:200px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
@media(max-width:560px){.sc-inner{grid-template-columns:1fr}}
.sc-left{padding:18px 16px;display:flex;flex-direction:column;justify-content:space-between}
.sc-logo{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.85rem;color:var(--p);margin-bottom:10px}
.sc-title{font-weight:800;font-size:1.05rem;line-height:1.25;margin-bottom:10px}
.sc-org{font-size:.85rem;color:#6b7280}.sc-org strong{display:block;color:#374151}
.sc-right{position:relative;min-height:180px;background:#ddd}
.sc-right img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.sc-overlay{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:3;flex-wrap:wrap;justify-content:center;width:92%}
.sc-pct{width:56px;height:56px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.sc-pct svg{position:absolute;inset:0;width:56px;height:56px;transform:rotate(-90deg)}
.sc-pct span{font-size:.75rem;font-weight:800;position:relative;z-index:1}
.sc-raised{background:var(--p);color:#fff;font-weight:800;font-size:.8rem;padding:6px 12px;border-radius:999px}
.sc-donow{background:var(--p-light);color:var(--p-dark);font-weight:800;font-size:.78rem;padding:6px 12px;border-radius:999px}
.sc-icons{display:flex;gap:10px;justify-content:center;padding:14px 0 4px;flex-wrap:wrap}
.sc-icons a,.sc-icons button{width:40px;height:40px;border-radius:50%;border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
.sc-icons .ic-copy{background:#e5e7eb;color:#374151}
.sc-icons .ic-fb{background:#1877f2}
.sc-icons .ic-wa{background:#25d366}
.sc-icons .ic-li{background:#0a66c2}
.report{margin:8px 0 16px;font-size:.85rem}
.report a{color:#6b7280;text-decoration:underline}
.copy-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;background:#1a1a1a;color:#fff;padding:10px 16px;border-radius:999px;font-size:.85rem;font-weight:600;z-index:80;display:none}
.copy-toast.on{display:block}
.empty{padding:40px 16px;color:#666}
</style>
</head>
<body>
<header class="hdr">
  <a href="/" class="logo"><img src="/logo-mark.svg" alt=""> HopeForUs</a>
  <a href="/" class="back">Discover</a>
</header>
<div class="wrap" id="app"><p class="empty">Loading campaign…</p></div>
<div class="copy-toast" id="copyToast">Link copied</div>
<script src="campaigns-data.js?v=16"></script>
<script src="supabase.js?v=16"></script>
<script src="app.js?v=16"></script>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var id=(params.get('id')||'').trim();
  var shareCode=(params.get('code')||'').toUpperCase().trim();
  var KNOWN={'EEPBA7':'c_mvs4qsny','VY84Q4':'c_mvs9eg5p'};
  if(KNOWN[id.toUpperCase()]){ shareCode=shareCode||id.toUpperCase(); id=KNOWN[id.toUpperCase()]; }
  var app=document.getElementById('app');
  if(!id){ app.innerHTML='<p class="empty">No campaign selected. <a href="/">Back home</a></p>'; return; }

  function esc(s){
    var a=String.fromCharCode(38);
    return String(s==null?'':s).replace(/&/g,a+'amp;').replace(/</g,a+'lt;').replace(/>/g,a+'gt;').replace(/"/g,a+'quot;').replace(/'/g,'&#39;');
  }
  function money(n,c){ n=Number(n)||0; var s=n.toLocaleString(); return c==='EUR'?'€':c==='GBP'?'£':'$'+s; }
  function moneyShort(n,c){
    n=Number(n)||0; var pre=c==='EUR'?'€':c==='GBP'?'£':'$';
    if(n>=1000) return pre+(n/1000).toFixed(n%1000===0?0:1).replace(/\.0$/,'')+'K';
    return pre+n.toLocaleString();
  }
  function findLocal(){
    var list=[]; try{list=JSON.parse(localStorage.getItem('hopeforus_campaigns')||'[]')}catch(e){}
    if(!Array.isArray(list)) list=[];
    var hit=list.find(function(x){
      if(!x) return false;
      if(x.id===id) return true;
      if(String(x.code||'').toUpperCase()===id.toUpperCase()) return true;
      if(shareCode && String(x.code||'').toUpperCase()===shareCode) return true;
      return false;
    });
    if(hit) return hit;
    if(typeof SAMPLES!=='undefined'){
      var s=(SAMPLES||[]).find(function(x){ return x && x.id===id; });
      if(s) return Object.assign({}, s);
    }
    return null;
  }
  function giftDonors(){
    var gifts=[]; try{gifts=JSON.parse(localStorage.getItem('hopeforus_gifts')||'[]')}catch(e){}
    if(!Array.isArray(gifts)) return [];
    return gifts.filter(function(g){
      return g && (g.campaignId===id || (shareCode && String(g.code||'').toUpperCase()===shareCode));
    }).map(function(g){
      return {name:g.donor||'Anonymous', amount:Number(g.amount)||0, time:'Just now', giftId:g.id||'', note:g.note||''};
    });
  }
  function mergePeople(lists){
    var seen={}, out=[];
    lists.forEach(function(list){
      (list||[]).forEach(function(d){
        if(!d) return;
        var name=d.name||d.donor||'Anonymous';
        var amt=Number(d.amount)||0;
        var key=(d.giftId||d.id||'')+'|'+name+'|'+amt;
        if(seen[key]) return;
        seen[key]=1;
        out.push({name:name, amount:amt, time:d.time||'', note:d.note||'', giftId:d.giftId||d.id||''});
      });
    });
    return out;
  }

  function paint(c){
    if(!c){ app.innerHTML='<p class="empty">Campaign not found. <a href="/">Back home</a></p>'; return; }
    var raised=Number(c.raised)||0, goal=Math.max(1, Number(c.goal)||1);
    var p=Math.min(100, Math.round(raised/goal*100));
    var img=c.image||c.image_url||'';
    var org=c.organizer||'Organizer';
    if(String(org).indexOf('@')>=0) org=String(org).split('@')[0];
    var donors=Array.isArray(c.donors)?c.donors:[];
    var code=(c.code||shareCode||'').toString();
    var shareUrl=code ? ((location.origin||'https://munowatchplus.watch')+'/c/'+encodeURIComponent(code.toUpperCase())) : (location.origin+'/campaign.html?id='+encodeURIComponent(c.id));
    var shareEnc=encodeURIComponent(shareUrl);
    var donateHref=(c.donationLink||'').trim() || ('donate.html?id='+encodeURIComponent(c.id));
    var ring=2*Math.PI*26, off=ring*(1-Math.min(1,p/100));
    var sc=2*Math.PI*22, scOff=sc*(1-Math.min(1,p/100));
    var top=donors[0];
    var recent=top ? (esc(top.name)+' donated '+money(top.amount,c.currency)) : ((Number(c.donations)||donors.length||0)+' donations');
    var donorHtml=donors.slice(0,12).map(function(d){
      var n=(d.name||'A').charAt(0).toUpperCase();
      return '<div class="donor"><div class="d-av">'+esc(n)+'</div><div><strong>'+esc(d.name||'Anonymous')+'</strong><div style="color:#666">'+money(d.amount,c.currency)+(d.time?' · '+esc(d.time):'')+'</div></div></div>';
    }).join('');
    var shareCard=
      '<div class="share-promo"><h3>Sharing helps more than you think</h3>'+
      '<p class="sub">On average, <strong>each share can inspire $50</strong> in donations by helping this fundraiser reach more people.</p>'+
      '<div class="sc-frame"><div class="sc-inner"><div class="sc-left"><div><div class="sc-logo">HopeForUs</div><div class="sc-title">'+esc(c.title||'')+'</div></div>'+
      '<div class="sc-org">Organized by<strong>'+esc(org)+'</strong></div></div>'+
      '<div class="sc-right">'+(img?'<img src="'+esc(img)+'" alt="">':'')+
      '<div class="sc-overlay"><div class="sc-pct"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="22" fill="none" stroke="#e5e7eb" stroke-width="5"/><circle cx="28" cy="28" r="22" fill="none" stroke="#7C3AED" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+sc.toFixed(1)+'" stroke-dashoffset="'+scOff.toFixed(1)+'"/></svg><span>'+p+'%</span></div>'+
      '<span class="sc-raised">'+money(raised,c.currency)+' raised</span><span class="sc-donow">Donate now!</span></div></div></div>'+
      '<div class="sc-icons">'+
      '<button type="button" class="ic-copy" id="scCopy" title="Copy link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>'+
      '<a class="ic-fb" href="https://www.facebook.com/sharer/sharer.php?u='+shareEnc+'" target="_blank" rel="noopener" title="Facebook"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.04v-2.66c0-3.02 1.79-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.95h-1.51c-1.49 0-1.95.93-1.95 1.89v2.28h3.32l-.53 3.49h-2.79V24C19.61 23.09 24 18.1 24 12.07z"/></svg></a>'+
      '<a class="ic-wa" href="https://wa.me/?text='+encodeURIComponent((c.title||'Support this fundraiser')+' '+shareUrl)+'" target="_blank" rel="noopener" title="WhatsApp"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 2.12.55 4.12 1.52 5.85L.05 24l6.34-1.66A11.94 11.94 0 0012 24c6.63 0 12-5.37 12-12S18.63 0 12 0zm5.15 16.4c-.25.7-1.44 1.32-2.01 1.41-.51.08-1.16.11-1.87-.12-.43-.14-.98-.33-1.69-.63-2.98-1.29-4.93-4.29-5.08-4.49-.15-.2-1.22-1.61-1.22-3.07 0-1.46.77-2.18 1.04-2.48.28-.3.6-.37.8-.37h.57c.18 0 .43-.08.67.5.25.59.85 2.05.92 2.2.07.15.12.32.02.52-.1.2-.15.33-.3.5-.15.17-.32.39-.45.52-.15.14-.3.3-.13.6.17.29.76 1.26 1.64 2.04 1.13 1.01 2.08 1.32 2.38 1.47.29.15.47.13.64-.07.17-.2.74-.86.94-1.16.2-.3.4-.25.67-.15.27.09 1.73.81 2.03.96.3.15.5.22.57.35.08.12.08.71-.17 1.41z"/></svg></a>'+
      '<a class="ic-li" href="https://www.linkedin.com/sharing/share-offsite/?url='+shareEnc+'" target="_blank" rel="noopener" title="LinkedIn"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 110-4.12 2.06 2.06 0 010 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.23 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.73V1.73C24 .77 23.21 0 22.23 0z"/></svg></a>'+
      '</div></div></div>';
    document.title=(c.title||'Campaign')+' – HopeForUs';
    app.innerHTML=
      '<div class="main">'+
      (c.video?'<div class="hero-img"><video src="'+esc(c.video)+'" controls playsinline></video></div>':(img?'<div class="hero-img"><img src="'+esc(img)+'" alt=""></div>':''))+
      '<h1>'+esc(c.title||'Untitled')+'</h1>'+
      '<div class="org"><div class="av">'+esc(String(org).charAt(0).toUpperCase())+'</div><div><strong>'+esc(org)+'</strong><div style="color:#6b7280;font-size:.85rem">'+(c.category||'Fundraiser')+'</div></div></div>'+
      '<div class="section"><div class="story" id="story">'+esc(c.story||'No story yet.')+'</div>'+((c.story||'').length>400?'<button type="button" class="read-more" id="readMore">Read more</button>':'')+'</div>'+
      shareCard+
      '<p class="report"><a href="/report.html?id='+encodeURIComponent(c.id)+'">Report this campaign</a></p>'+
      (donorHtml?'<div class="section"><h3>'+(Number(c.donations)||donors.length)+' donations</h3><div class="donors">'+donorHtml+'</div></div>':'')+
      '</div>'+
      '<aside class="side"><div class="card">'+
      '<div class="raise-row"><div class="ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#e8e8e8" stroke-width="6"/><circle cx="32" cy="32" r="26" fill="none" stroke="#7C3AED" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+ring.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg><div class="ring-pct">'+p+'%</div></div>'+
      '<div class="raise-meta"><div class="raised">'+money(raised,c.currency)+' raised <span>of '+moneyShort(goal,c.currency)+'</span></div><div class="recent-line">'+recent+'</div></div></div>'+
      '<div class="btn-row"><a class="btn-donate" href="'+esc(donateHref)+'" '+(c.donationLink?'target="_blank" rel="noopener"':'')+'>Donate</a>'+
      '<button type="button" class="btn-share" id="shareBtn">Share</button></div>'+
      '</div></aside>';
    var rm=document.getElementById('readMore');
    if(rm){ var st=document.getElementById('story'); st.classList.add('clamp'); rm.onclick=function(){ st.classList.toggle('clamp'); rm.textContent=st.classList.contains('clamp')?'Read more':'Show less'; }; }
    function copyLink(){
      var t=document.getElementById('copyToast');
      function ok(){ if(!t) return; t.classList.add('on'); setTimeout(function(){ t.classList.remove('on'); }, 1600); }
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(shareUrl).then(ok).catch(ok);
      else ok();
    }
    var shareBtn=document.getElementById('shareBtn');
    if(shareBtn) shareBtn.onclick=copyLink;
    var scCopy=document.getElementById('scCopy');
    if(scCopy) scCopy.onclick=copyLink;
  }

  var local=findLocal();
  if(local) paint(local);
  var remoteJob=(window.HFDB&&HFDB.one)?HFDB.one(id).catch(function(){return null;}):Promise.resolve(null);
  var donorJob=(window.HFDB&&HFDB.loadDonors)?HFDB.loadDonors(id):Promise.resolve([]);
  Promise.all([remoteJob, donorJob]).then(function(parts){
    var remote=parts[0], fileDonors=parts[1]||[];
    var base=local||remote;
    if(!base && !remote){ if(!local) paint(null); return; }
    var raised=Math.max(Number(local&&local.raised)||0, Number(remote&&remote.raised)||0);
    var donations=Math.max(Number(local&&local.donations)||0, Number(remote&&remote.donations)||0);
    var people=mergePeople([local&&local.donors, remote&&remote.donors, fileDonors, giftDonors()]);
    if(donations<people.length) donations=people.length;
    var merged=Object.assign({}, base||{}, remote||{}, {
      raised:raised,
      donations:donations,
      donors:people,
      image:(remote&&remote.image)||(local&&local.image)||'',
      story:(local&&local.story)||(remote&&remote.story)||'',
      title:(local&&local.title)||(remote&&remote.title)||'',
      organizer:(local&&local.organizer)||(remote&&remote.organizer)||'',
      category:(local&&local.category)||(remote&&remote.category)||'',
      donationLink:(remote&&remote.donationLink)||(local&&local.donationLink)||'',
      goal:Math.max(Number(local&&local.goal)||0, Number(remote&&remote.goal)||0),
      media:(remote&&remote.media)||(local&&local.media)||[],
      code:(local&&local.code)||(remote&&remote.code)||shareCode||'',
      id:(base&&base.id)||id
    });
    paint(merged);
    if(people.length && window.HFDB && HFDB.publishDonors && people.length>(fileDonors||[]).length){
      HFDB.publishDonors(merged.id, people);
    }
  }).catch(function(){ if(!local) paint(null); });
})();
</script>
</body>
</html>
