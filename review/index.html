<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review campaign · HopeForUs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c1c1c;--muted:#6b6b6b;--line:#e7e5e1;--bg:#f6f5f2}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
a{color:#4C1D95;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
.back{font-weight:700;font-size:14px}
h1{font-size:1.4rem;margin:14px 0 4px}
.note{color:var(--muted);font-size:.9rem}
.shot{width:100%;max-height:360px;object-fit:cover;border-radius:16px;background:#eee;margin:14px 0}
.story{white-space:pre-wrap;line-height:1.55;margin:8px 0 16px}
label{display:block;font-size:.8rem;font-weight:700;margin:12px 0 4px}
input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font:inherit}
.row{display:flex;gap:8px;margin-top:14px}
button{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.go{background:#4C1D95;color:#fff;border-color:#4C1D95}
.bad{color:#b91c1c;border-color:#fecaca}
.media{display:flex;gap:8px;overflow:auto;margin:8px 0 12px}
.media img,.media video{width:120px;height:90px;object-fit:cover;border-radius:10px;background:#eee}
.err{color:#b91c1c;font-size:.85rem;min-height:1.2em}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/dashboard/#admin">← Back to Approve</a>
  <div id="app"><p class="note">Loading campaign…</p></div>
</div>
<script src="/supabase.js?v=12"></script>
<script src="/shared-camps.js?v=12"></script>
<script src="/campaigns-data.js?v=12"></script>
<script src="/app.js?v=12"></script>
<script>
var u=HF.session();
if(!u){ location.replace('/login?return='+encodeURIComponent(location.pathname+location.search)); throw 0; }
if(!(HF.isAdmin&&HF.isAdmin())){ location.replace('/dashboard/'); throw 0; }
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]})}
function idFromUrl(){
  var q=new URLSearchParams(location.search).get('id')||'';
  try{ return decodeURIComponent(q); }catch(e){ return q; }
}
function localList(){
  try{ var list=JSON.parse(localStorage.getItem('hopeforus_campaigns')||'[]'); return Array.isArray(list)?list:[]; }
  catch(e){ return []; }
}
function findCamp(id, extra){
  var all=localList().concat(extra||[]);
  if(window.SAMPLES) all=all.concat(SAMPLES);
  for(var i=0;i<all.length;i++){ if(all[i]&&(all[i].id===id||all[i].code===id)) return all[i]; }
  return null;
}
function mediaHtml(c){
  var bits=[], seen={};
  function add(src, kind){
    if(!src||seen[src]) return;
    seen[src]=1;
    if(kind==='video') bits.push('<video src="'+esc(src)+'" controls></video>');
    else bits.push('<img src="'+esc(src)+'" alt="">');
  }
  add(c.image,'image');
  (c.images||[]).forEach(function(s){ add(s,'image'); });
  (c.media||[]).forEach(function(m){
    if(!m) return;
    add(m.dataUrl||m.url||m.src, m.type==='video'?'video':'image');
  });
  if(c.video) add(c.video,'video');
  return bits.length?'<div class="media">'+bits.join('')+'</div>':'';
}
function paint(c){
  var app=document.getElementById('app');
  if(!c){
    app.innerHTML='<h1>Campaign not found</h1><p class="note">It is not on this device yet. Open the phone that created it, then come back.</p>';
    return;
  }
  var photo=c.image?'<img class="shot" src="'+esc(c.image)+'" alt="">':'<div class="shot"></div>';
  app.innerHTML='<h1>'+esc(c.title||'Campaign')+'</h1>'
    +'<p class="note">'+esc(c.ownerEmail||c.organizerEmail||c.organizer||'No email')+' · '+(c.status==='approved'?'Approved':'Waiting')+'</p>'
    +photo
    +mediaHtml(c)
    +'<div class="story">'+esc(c.story||'No story was saved with this campaign.')+'</div>'
    +'<label>Donation link</label><input id="dlink" placeholder="https://" value="'+esc(c.donationLink||'')+'">'
    +'<p class="err" id="err"></p>'
    +'<div class="row"><button class="go" id="ok" type="button">Approve</button><button class="bad" id="no" type="button">Reject</button><button class="bad" id="del" type="button">Delete</button></div>';
  document.getElementById('ok').onclick=function(){
    var url=(document.getElementById('dlink').value||'').trim();
    if(!url||url.indexOf('http')!==0){ document.getElementById('err').textContent='Paste a donation link that starts with https://'; return; }
    HF.setCampaignDonationLink(c.id, url);
    HF.setCampaignStatus(c.id, 'approved');
    c.status='approved'; c.donationLink=url;
    var done=function(){ location.href='/dashboard/#admin'; };
    var push=window.HFDB?HFDB.update(c.id,{status:'approved',donation_link:url}).catch(function(){}):Promise.resolve();
    push.then(function(){ return window.HFShared?HFShared.push(c):null; }).then(done).catch(done);
  };
  document.getElementById('no').onclick=function(){
    HF.setCampaignStatus(c.id, 'rejected');
    c.status='rejected';
    var done=function(){ location.href='/dashboard/#admin'; };
    if(window.HFShared) HFShared.push(c).then(done).catch(done); else done();
  };
  document.getElementById('del').onclick=function(){
    if(!confirm('Delete this campaign forever? It will disappear for the organizer and for you.')) return;
    HF.deleteCampaign(c.id);
    location.href='/dashboard/#admin';
  };
}
var id=idFromUrl();
var camp=findCamp(id);
if(camp) paint(camp);
else document.getElementById('app').innerHTML='<p class="note">Loading campaign…</p>';
var jobs=[];
if(window.HFDB) jobs.push(HFDB.one(id).catch(function(){ return null; }));
if(window.HFShared) jobs.push(HFShared.pull().then(function(list){ HFShared.merge(list); return list; }).catch(function(){ return []; }));
Promise.all(jobs).then(function(parts){
  var remote=parts[0];
  var list=parts[1]||[];
  var found=remote||findCamp(id, list);
  paint(found);
}).catch(function(){ if(!camp) paint(null); });
</script>
</body>
</html>
