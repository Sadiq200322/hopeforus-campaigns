<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Donate – HopeForUs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#f8f7f4;color:#1c1c1c;min-height:100vh;padding:20px 16px 40px}
.wrap{max-width:440px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{font-weight:800;color:#4C1D95;text-decoration:none;font-size:1.1rem}
.back{color:#7C3AED;font-weight:600;text-decoration:none;font-size:.95rem;background:none;border:0;cursor:pointer;font:inherit}
h1{font-size:1.5rem;font-weight:800;margin-bottom:4px}
.sub{color:#6b6b6b;margin-bottom:18px}
.go{display:block;width:100%;margin-top:20px;height:48px;border:0;border-radius:999px;background:#7C3AED;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
.note{font-size:.8rem;color:#888;margin-top:14px;text-align:center;line-height:1.4}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center}
.overlay.show{display:flex}
.iframe-wrap{width:92%;max-width:480px;height:82vh;background:#fff;border-radius:12px;overflow:hidden;position:relative}
.iframe-wrap iframe{width:100%;height:100%;border:none}
.close-btn{position:absolute;top:8px;right:8px;background:#fff;border:1px solid #ddd;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px;z-index:2}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="/" class="logo">HopeForUs</a>
    <button type="button" class="back" id="backBtn">← Back</button>
  </div>
  <h1>Donate</h1>
  <p class="sub" id="campTitle">Loading…</p>
  <button type="button" class="go" id="goBtn">Credit card / PayPal</button>
  <p class="note">Pay with PayPal or card. Choose your amount on the next screen.</p>
</div>

<div class="overlay" id="kofiOverlay">
  <div class="iframe-wrap">
    <button class="close-btn" id="closeBtn">×</button>
    <iframe id="kofiFrame" src=""></iframe>
  </div>
</div>

<script src="/campaigns-data.js"></script>
<script>
(function(){
var params = new URLSearchParams(location.search);
var id = params.get("id") || "";
var list = [];
try { list = JSON.parse(localStorage.getItem("hopeforus_campaigns") || "[]") || []; } catch(e) {}
var c = null;
for (var i = 0; i < list.length; i++) { if (list[i] && list[i].id === id) { c = list[i]; break; } }
if (!c && typeof SAMPLES !== "undefined") {
  for (var j = 0; j < SAMPLES.length; j++) { if (SAMPLES[j] && SAMPLES[j].id === id) { c = SAMPLES[j]; break; } }
}
if (!c) {
  document.getElementById("campTitle").textContent = "Campaign not found.";
  document.getElementById("goBtn").disabled = true;
  return;
}
var shortKey = (c.code || c.id || id).toString();
document.getElementById("campTitle").textContent = c.title || "";
document.getElementById("backBtn").onclick = function() { location.href = "/c/" + encodeURIComponent(shortKey); };

var overlay = document.getElementById("kofiOverlay");
var frame = document.getElementById("kofiFrame");
var closeBtn = document.getElementById("closeBtn");

document.getElementById("goBtn").onclick = function() {
  frame.src = "https://ko-fi.com/hopeforus0/?hidefeed=true&widget=true&embed=true";
  overlay.classList.add("show");
};

closeBtn.onclick = function() {
  overlay.classList.remove("show");
  frame.src = "";
};
overlay.onclick = function(e) {
  if (e.target === overlay) closeBtn.onclick();
};
})();
</script>
</body>
</html>
