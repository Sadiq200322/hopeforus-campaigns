<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Start a HopeForUs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,sans-serif;background:#f7f7f7;color:#1a1a1a;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.top{background:#fff;border-bottom:1px solid #e8e8e8;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.top a{font-weight:800;text-decoration:none;color:#1a1a1a;display:flex;align-items:center;gap:8px}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px}
h1{font-size:1.4rem;font-weight:800;margin-bottom:6px}
.lead{color:#5c5c5c;font-size:.95rem;margin-bottom:20px}
.card{background:#fff;border-radius:16px;border:1px solid #e8e8e8;padding:18px;margin-bottom:14px}
label{display:block;font-size:.85rem;font-weight:600;margin:10px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:.95rem;font-family:inherit}
textarea{min-height:120px;resize:vertical}
.cover-upload{border:2px dashed #d1d5db;border-radius:16px;min-height:200px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;background:#fafafa;overflow:hidden;position:relative}
.cover-upload:hover{border-color:#7C3AED;background:#EDE9FE}
.cover-upload.required-error{border-color:#dc2626;background:#fef2f2}
.cover-upload img,.cover-upload video{width:100%;height:220px;object-fit:cover;display:block}
.cover-upload .hint{text-align:center;padding:24px 16px;color:#6b7280}
.cover-upload .hint strong{color:#1a1a1a;display:block;margin-bottom:6px}
.req{display:inline-block;background:#fef3c7;color:#92400e;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:6px;margin-top:8px}
.btn{width:100%;padding:14px;border:none;border-radius:999px;background:#7C3AED;color:#fff;font-weight:700;font-size:1rem;cursor:pointer;margin-top:12px;font-family:inherit}
.btn:disabled{opacity:.6}
.field-error{color:#dc2626;font-size:.8rem;display:none;margin-top:6px}
.field-error.show{display:block}
.auth-message{padding:12px;border-radius:10px;margin-top:12px;font-size:.9rem;display:none}
.auth-message.success{background:#EDE9FE;color:#5B21B6;display:block}
.auth-message.error{background:#fef2f2;color:#991b1b;display:block}
.steps-hint{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:.8rem}
.steps-hint span{padding:6px 10px;border-radius:999px;background:#f3f4f6;color:#5c5c5c}
.steps-hint .on{background:#EDE9FE;color:#5B21B6;font-weight:700}
</style>
</head>
<body>
<div class="top">
  <a href="index.html"><img src="logo-mark.svg" width="26" height="26" alt=""> HopeForUs</a>
  <a href="dashboard.html" style="font-size:.85rem;font-weight:600;color:#7C3AED">Dashboard</a>
</div>
<div class="wrap">
  <h1>Start a HopeForUs</h1>
  <p class="lead">A cover photo or video is required — you can add more photos later as updates.</p>
  <div class="steps-hint"><span class="on">1. Cover media</span><span>2. Details</span><span>3. Publish</span></div>
  <form id="createForm">
    <div class="card">
      <div class="cover-upload" id="coverZone">
        <div class="hint"><strong>Add your cover photo or video</strong>Tap or drop · JPG, PNG, MP4<div class="req">Required to publish</div></div>
        <input type="file" id="coverInput" accept="image/*,video/*" hidden>
      </div>
      <p class="field-error" id="coverError">Please add a cover photo or video before publishing.</p>
    </div>
    <div class="card">
      <label for="title">Campaign title *</label>
      <input type="text" id="title" required maxlength="120" placeholder="e.g. Help me cover surgery costs">
      <label for="goal">Goal (USD) *</label>
      <input type="number" id="goal" required min="1" placeholder="5000">
      <label for="startRaised">Starting balance (optional)</label>
      <input type="number" id="startRaised" min="0" value="0">
      <label for="code">Campaign code * (use in donate message)</label>
      <input type="text" id="code" required maxlength="20" placeholder="MYCODE" style="text-transform:uppercase">
      <label for="category">Category</label>
      <select id="category">
        <option value="medical">Medical</option>
        <option value="emergency">Emergency</option>
        <option value="education">Education</option>
        <option value="animals">Animals</option>
        <option value="community">Community</option>
        <option value="memorial">Memorial</option>
        <option value="sports">Sports</option>
      </select>
      <label for="story">Your story *</label>
      <textarea id="story" required placeholder="Tell donors why this matters…"></textarea>
      <label for="social">Social media link (optional)</label>
      <input type="url" id="social" placeholder="https://instagram.com/you">
      <button class="btn" type="submit" id="pubBtn">Publish fundraiser</button>
      <div class="auth-message" id="createMsg"></div>
    </div>
  </form>
</div>
<script src="app.js"></script>
<script>
(function(){
  var user=null;try{user=JSON.parse(localStorage.getItem('hopeforus_user')||'null')}catch(e){}
  if(!user||!user.email){location.href='login.html?next=create-campaign.html';return}
  var coverData=null;
  var coverZone=document.getElementById('coverZone'),coverInput=document.getElementById('coverInput');
  coverZone.addEventListener('click',function(){coverInput.click()});
  coverZone.addEventListener('dragover',function(e){e.preventDefault()});
  coverZone.addEventListener('drop',function(e){e.preventDefault();if(e.dataTransfer.files[0])setCover(e.dataTransfer.files[0])});
  coverInput.addEventListener('change',function(){if(coverInput.files[0])setCover(coverInput.files[0])});

  function compressImage(file,maxW,quality,cb){
    if(!file.type||file.type.indexOf('image')!==0){
      var r=new FileReader();r.onload=function(){cb(r.result,file.type)};r.readAsDataURL(file);return;
    }
    var img=new Image();
    var url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.width,h=img.height,scale=Math.min(1,maxW/Math.max(w,h));
      var cw=Math.round(w*scale),ch=Math.round(h*scale);
      var c=document.createElement('canvas');c.width=cw;c.height=ch;
      c.getContext('2d').drawImage(img,0,0,cw,ch);
      URL.revokeObjectURL(url);
      cb(c.toDataURL('image/jpeg',quality),'image/jpeg');
    };
    img.onerror=function(){
      URL.revokeObjectURL(url);
      var r=new FileReader();r.onload=function(){cb(r.result,file.type)};r.readAsDataURL(file);
    };
    img.src=url;
  }

  function setCover(file){
    compressImage(file,1200,0.72,function(dataUrl,type){
      coverData={type:type,dataUrl:dataUrl};
      coverZone.classList.remove('required-error');
      document.getElementById('coverError').classList.remove('show');
      coverZone.innerHTML='';
      if(type.indexOf('video')===0){
        var v=document.createElement('video');v.src=dataUrl;v.controls=true;v.muted=true;coverZone.appendChild(v);
      }else{
        var img=document.createElement('img');img.src=dataUrl;img.alt='Cover';coverZone.appendChild(img);
      }
      var change=document.createElement('div');
      change.style.cssText='position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:6px 14px;border-radius:999px;font-size:.8rem;font-weight:600;pointer-events:none';
      change.textContent='Tap to change';
      coverZone.appendChild(change);
    });
  }

  document.getElementById('createForm').addEventListener('submit',function(e){
    e.preventDefault();
    if(!coverData||!coverData.dataUrl){
      coverZone.classList.add('required-error');
      document.getElementById('coverError').classList.add('show');
      coverZone.scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
    var title=document.getElementById('title').value.trim();
    var goal=parseInt(document.getElementById('goal').value,10);
    var code=document.getElementById('code').value.trim().toUpperCase().replace(/\s+/g,'');
    var story=document.getElementById('story').value.trim();
    var category=document.getElementById('category').value;
    var social=document.getElementById('social').value.trim();
    if(!title||!goal||!code||!story)return;
    var id='c_'+Date.now();
    var campaign={
      id:id,title:title,goal:goal,
      raised:parseInt(document.getElementById('startRaised').value,10)||0,
      code:code,story:story,category:category,social:social||'',
      cover:coverData,image:coverData.type.indexOf('video')===0?'':coverData.dataUrl,
      media:[],updates:[],
      organizer:user.name||'Organizer',createdAt:new Date().toISOString(),
      ownerEmail:user.email||'',status:'active'
    };
    var list=[];try{list=JSON.parse(localStorage.getItem('hopeforus_campaigns')||'[]')}catch(err){}
    list.unshift(campaign);
    try{
      localStorage.setItem('hopeforus_campaigns',JSON.stringify(list));
    }catch(err){
      // retry without huge cover if storage full
      campaign.cover={type:'image/jpeg',dataUrl:campaign.image};
      try{localStorage.setItem('hopeforus_campaigns',JSON.stringify(list));}
      catch(e2){
        var m=document.getElementById('createMsg');m.className='auth-message error';m.textContent='Storage full. Use a smaller photo.';return;
      }
    }
    var msg=document.getElementById('createMsg');
    msg.className='auth-message success';
    msg.textContent='Campaign published! Opening…';
    setTimeout(function(){location.href='campaign.html?id='+encodeURIComponent(id)},500);
  });
})();
</script>
</body>
</html>
