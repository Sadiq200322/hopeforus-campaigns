<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Start a HopeForUs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#7C3AED;--pd:#4C1D95;--soft:#EDE9FE;--ink:#1a1a1a;--muted:#5c5c5c;--line:#e5e5e5;--panel:#f3f2f0;--ok:#00a964}
html,body{height:100%;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--panel);overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
.shell{min-height:100%;display:grid}
@media(min-width:900px){.shell{grid-template-columns:minmax(240px,34%) 1fr}}
.side{padding:20px 24px 40px}
.side .logo{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--p)}
.side .logo img{width:28px;height:28px}
.side .stepn{margin-top:40px;font-size:.85rem;color:var(--muted);font-weight:600}
.side h1{margin-top:10px;font-size:clamp(1.45rem,3.2vw,2rem);font-weight:800;line-height:1.15;max-width:280px}
.side p{margin-top:10px;color:var(--muted);max-width:280px;font-size:.95rem}
.main{background:#fff;min-height:70vh;display:flex;flex-direction:column;border-radius:20px 20px 0 0}
@media(min-width:900px){.main{min-height:100vh;border-radius:20px 0 0 20px}}
.topr{display:flex;justify-content:flex-end;padding:16px 20px;font-size:.9rem;font-weight:600}
.body{flex:1;width:100%;max-width:720px;margin:0 auto;padding:8px 20px 100px}
h2{font-size:1rem;font-weight:700;margin-bottom:6px}
.hint{font-size:.88rem;color:var(--muted);margin-bottom:16px}
.row2{display:grid;gap:12px}
@media(min-width:560px){.row2{grid-template-columns:1fr 1fr}}
label.f{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px;font-weight:600}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:.95rem;font-family:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:.85rem}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.choice{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;margin-bottom:10px}
.choice.on{border-color:var(--ink)}
.choice .ic{width:48px;height:48px;border-radius:12px;background:var(--panel);display:grid;place-items:center;flex-shrink:0;font-size:1.2rem}
.choice strong{display:block;font-size:.95rem}
.choice span{display:block;font-size:.85rem;color:var(--muted);margin-top:2px}
.amt{display:flex;align-items:center;height:56px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;gap:8px}
.amt input{border:0;padding:0;font-size:1.05rem;font-weight:600}
.amt .cur{background:var(--panel);border-radius:8px;padding:4px 8px;font-size:.75rem;font-weight:700;color:var(--muted)}
.auto{margin-top:16px;background:var(--panel);border-radius:14px;padding:16px}
.auto .badge{display:inline-block;background:var(--soft);color:var(--p);font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:6px}
.sw{width:48px;height:28px;border-radius:999px;border:0;background:#d1d5db;position:relative;flex-shrink:0}
.sw.on{background:var(--ok)}
.sw i{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);transition:transform .2s}
.sw.on i{transform:translateX(20px)}
.foot{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
.prog{display:none;flex:1;height:4px;background:var(--line);border-radius:99px;overflow:hidden}
@media(min-width:560px){.prog{display:block}}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.back{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:1.2rem}
.back:disabled{opacity:.3}
.cont{margin-left:auto;height:44px;padding:0 22px;border-radius:999px;border:0;background:var(--pd);color:#E9D5FF;font-weight:700}
.err{color:#b91c1c;font-size:.88rem;font-weight:600;margin-top:12px;display:none}
.err.show{display:block}
.media-grid{display:flex;gap:8px;overflow-x:auto;margin-top:10px}
.media-grid img,.media-grid video{width:120px;height:80px;object-fit:cover;border-radius:10px;flex-shrink:0}
.acct{max-width:400px}
.acct .note{font-size:.85rem;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="logo" href="index.html"><img src="logo-mark.svg" alt=""> HopeForUs</a>
    <div class="stepn" id="stepn">1 of 6</div>
    <h1 id="stitle">Let's begin your fundraising journey</h1>
    <p id="ssub">We're here to guide you every step of the way.</p>
  </aside>
  <section class="main">
    <div class="topr" id="topr"><a href="login.html">Sign in</a></div>
    <div class="body" id="body"></div>
    <div class="foot">
      <div class="prog"><i id="prog"></i></div>
      <button type="button" class="back" id="back" aria-label="Back">←</button>
      <button type="button" class="cont" id="cont">Continue</button>
    </div>
  </section>
</div>
<script src="clear-test-data.js"></script>
<script>
var CATS=["Animals","Business","Community","Competitions","Creative","Education","Emergencies","Environment","Events","Faith","Family","Funerals & Memorials","Medical","Monthly Bills","Newlyweds","Other","Sports","Travel","Volunteer","Wishes"];
var COUNTRIES=["United States","United Kingdom","Canada","Kenya","Uganda","Nigeria","Germany","France","India","Australia"];
var STEPS=6;
var step=0;
var draft={country:"United States",zip:"",category:"",beneficiary:"",goal:"",autoGoal:true,title:"",story:"",media:[]};
var user=null;
try{user=JSON.parse(localStorage.getItem("hopeforus_user")||"null")}catch(e){}
var titles=[
  ["Let's begin your fundraising journey","We're here to guide you every step of the way."],
  ["Tell us who you're raising funds for","This helps us tailor guidance for your fundraiser."],
  ["Tell us how much you'd like to raise","You can change this later from your organizer desk."],
  ["Create your account","Email and password so you can return to your fundraiser."],
  ["Almost there","Confirm your details then add your story."],
  ["Add the story people will see","Photos and a short video help donors understand fast."]
];
function $(id){return document.getElementById(id)}
function goalNum(){return Number(draft.goal)||0}
function startGoal(){var g=goalNum();return draft.autoGoal?Math.max(50,Math.round(g*0.6)):g}
function esc(s){return String(s||"").replace(/&/g,"&").replace(/</g,"<").replace(/"/g,""")}
function showErr(msg){var e=$("err");if(e){e.textContent=msg;e.classList.add("show")}}
function isLoggedIn(){return !!(user&&user.email)}
function paintMedia(){
  var mg=$("mg");if(!mg)return;mg.innerHTML="";
  draft.media.forEach(function(m){
    if(m.type==="video"){var v=document.createElement("video");v.src=m.dataUrl;v.muted=true;v.autoplay=true;v.loop=true;v.playsInline=true;mg.appendChild(v)}
    else{var img=document.createElement("img");img.src=m.dataUrl;img.alt="";mg.appendChild(img)}
  });
}
function render(){
  $("stepn").textContent=(step+1)+" of "+STEPS;
  $("stitle").textContent=titles[step][0];
  $("ssub").textContent=titles[step][1];
  $("prog").style.width=((step+1)/STEPS*100)+"%";
  $("back").disabled=step===0;
  $("cont").textContent=step===5?"Publish":"Continue";
  if(isLoggedIn()){$("topr").innerHTML='<a href="dashboard.html">'+(user.name||user.email)+'</a>'}
  else{$("topr").innerHTML='<a href="login.html">Sign in</a>'}
  var el=$("body");el.innerHTML="";
  var err=document.createElement("p");err.className="err";err.id="err";
  if(step===0){
    el.innerHTML='<h2>Where will the funds go?</h2><p class="hint">Choose the location where you plan to withdraw your funds.</p><div class="row2"><div><label class="f">Country</label><select id="country"></select></div><div><label class="f">Postal / ZIP code</label><input id="zip" placeholder="Zip code" value="'+esc(draft.zip)+'"></div></div><h2 style="margin-top:28px">What best describes why you\'re fundraising?</h2><div class="chips" id="chips"></div>';
    var sel=$("country");COUNTRIES.forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=c;if(c===draft.country)o.selected=true;sel.appendChild(o)});
    var chips=$("chips");CATS.forEach(function(c){var b=document.createElement("button");b.type="button";b.className="chip"+(draft.category===c?" on":"");b.textContent=c;b.onclick=function(){draft.category=c;render()};chips.appendChild(b)});
  } else if(step===1){
    el.innerHTML='<h2>Who are you fundraising for?</h2>';
    [["yourself","Yourself","Funds go to your account for your own use.","👤"],["someone","Someone else","Invite a beneficiary or distribute funds yourself.","👥"],["charity","Charity","Funds go to a nonprofit you name in the story.","🎗️"]].forEach(function(x){
      var b=document.createElement("button");b.type="button";b.className="choice"+(draft.beneficiary===x[0]?" on":"");
      b.innerHTML='<span class="ic">'+x[3]+'</span><span><strong>'+x[1]+'</strong><span>'+x[2]+'</span></span>';
      b.onclick=function(){draft.beneficiary=x[0];render()};
      el.appendChild(b);
    });
  } else if(step===2){
    el.innerHTML='<div class="amt"><span>$</span><input id="goal" inputmode="numeric" placeholder="Enter amount" value="'+esc(draft.goal)+'"><span class="cur">USD</span></div><p class="hint" style="margin-top:8px">Fundraisers like yours typically aim to raise $5,000</p><div class="auto"><div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-start"><div><span class="badge">RECOMMENDED</span><p style="font-weight:700;margin-top:8px">Automated goal setting</p><p class="hint" style="margin:4px 0 0">Start lower and raise the public goal as donations come in.</p></div><button type="button" class="sw'+(draft.autoGoal?" on":"")+'" id="autoSw"><i></i></button></div><div id="startHint" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:.9rem;display:'+(draft.autoGoal&&goalNum()>=50?"block":"none")+'">Your starting goal would be: <strong>$'+startGoal().toLocaleString()+'</strong></div></div>';
    $("goal").oninput=function(){draft.goal=this.value.replace(/[^\d]/g,"");this.value=draft.goal;var sh=$("startHint");if(sh){sh.style.display=draft.autoGoal&&goalNum()>=50?"block":"none";sh.innerHTML='Your starting goal would be: <strong>$'+startGoal().toLocaleString()+'</strong>'}};
    $("autoSw").onclick=function(){draft.autoGoal=!draft.autoGoal;render()};
  } else if(step===3){
    el.innerHTML='<div class="acct"><h2>Your preferred email</h2><p class="hint">Just email and a password — no Google or Apple required.</p><label class="f">Email</label><input type="email" id="regEmail" placeholder="you@email.com" autocomplete="email"><label class="f" style="margin-top:12px">Password</label><input type="password" id="regPass" placeholder="At least 6 characters" autocomplete="new-password"><label class="f" style="margin-top:12px">Display name (optional)</label><input type="text" id="regName" placeholder="How donors see you" autocomplete="name"><p class="note">Already have an account? <a href="login.html" style="color:var(--p);font-weight:700">Sign in</a> first, then start a fundraiser.</p></div>';
  } else if(step===4){
    el.innerHTML='<div class="acct"><h2>You\'re set</h2><p class="hint">Next, add a title, story, and at least one photo or video.</p><p style="font-weight:600">Signed in as '+(user&&user.email?esc(user.email):"")+'</p></div>';
  } else if(step===5){
    el.innerHTML='<label class="f">Fundraiser title</label><input id="title" placeholder="Help Maya finish nursing school" value="'+esc(draft.title)+'"><label class="f" style="margin-top:14px">Story</label><textarea id="story" rows="5" placeholder="What happened, and how will the funds help?">'+esc(draft.story)+'</textarea><label class="f" style="margin-top:14px">Photos and video (required)</label><input type="file" id="files" accept="image/*,video/*" multiple><div class="media-grid" id="mg"></div>';
    $("title").oninput=function(){draft.title=this.value};
    $("story").oninput=function(){draft.story=this.value};
    paintMedia();
    $("files").onchange=function(e){
      Array.from(e.target.files||[]).slice(0,6).forEach(function(file){
        var r=new FileReader();
        r.onload=function(){
          draft.media.push({type:file.type.indexOf("video")===0?"video":"image",dataUrl:String(r.result),name:file.name});
          if(draft.media.length>8)draft.media=draft.media.slice(0,8);
          paintMedia();
        };
        r.readAsDataURL(file);
      });
    };
  }
  el.appendChild(err);
}
function saveUser(email, pass, name){
  user={id:"u_"+email.toLowerCase(),email:email.toLowerCase(),name:(name||email.split("@")[0]),password:pass,provider:"email"};
  var users=[];try{users=JSON.parse(localStorage.getItem("hopeforus_users")||"[]")}catch(e){}
  if(!Array.isArray(users))users=[];
  users=users.filter(function(u){return u.email!==user.email});
  users.push(user);
  try{localStorage.setItem("hopeforus_users",JSON.stringify(users))}catch(e){}
  try{localStorage.setItem("hopeforus_user",JSON.stringify({id:user.id,email:user.email,name:user.name,provider:"email"}))}catch(e){}
}
function publish(){
  if(!isLoggedIn()){step=3;render();return}
  if(!draft.title.trim())return showErr("Add a title.");
  if(!draft.media.length)return showErr("Add at least one photo or video.");
  var goal=Math.max(1,goalNum());
  var id="c_"+Date.now().toString(36);
  var camp={id:id,ownerId:user.id,organizer:user.name,title:draft.title.trim(),story:draft.story.trim(),country:draft.country,zip:draft.zip,category:draft.category||"Other",beneficiary:draft.beneficiary||"yourself",goal:goal,startGoal:startGoal(),autoGoal:draft.autoGoal,raised:0,donations:0,currency:"USD",image:draft.media[0]&&draft.media[0].type==="image"?draft.media[0].dataUrl:"",media:draft.media,createdAt:new Date().toISOString()};
  var list=[];try{list=JSON.parse(localStorage.getItem("hopeforus_campaigns")||"[]")}catch(e){}
  if(!Array.isArray(list))list=[];
  list.unshift(camp);
  try{localStorage.setItem("hopeforus_campaigns",JSON.stringify(list))}catch(e){return showErr("Could not save media — try fewer or smaller files.")}
  location.href="dashboard.html";
}
$("back").onclick=function(){
  if(step===0)return;
  if(isLoggedIn()&&step===5){step=2;render();return}
  if(step===5&&!isLoggedIn()){step=4;render();return}
  step--;render();
};
$("cont").onclick=function(){
  if(step===0){draft.country=$("country").value;draft.zip=$("zip").value;if(!draft.category)return showErr("Choose what best describes the fundraiser.");step=1;render();return}
  if(step===1){if(!draft.beneficiary)return showErr("Choose who the funds are for.");step=2;render();return}
  if(step===2){if(goalNum()<50)return showErr("Enter a goal of at least 50.");if(isLoggedIn()){step=5;render();return}step=3;render();return}
  if(step===3){
    var email=($("regEmail").value||"").trim();
    var pass=($("regPass").value||"");
    var name=($("regName").value||"").trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return showErr("Enter a valid email.");
    if(pass.length<6)return showErr("Password must be at least 6 characters.");
    saveUser(email,pass,name);step=4;render();return;
  }
  if(step===4){step=5;render();return}
  if(step===5){publish();return}
};
render();
</script>
</body>
</html>
