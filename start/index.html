<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Start a HopeForUs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#7C3AED;--pd:#4C1D95;--soft:#EDE9FE;--ok:#00a964;--line:#e5e7eb;--muted:#6b7280;--panel:#f8fafc;--font:Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font);background:#fff;color:#111;min-height:100vh}
.shell{display:grid;grid-template-columns:minmax(240px,340px) 1fr;min-height:100vh}
.side{background:linear-gradient(165deg,#4C1D95,#7C3AED 55%,#a78bfa);color:#fff;padding:28px 24px;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;font-size:1.05rem}
.logo img{width:32px;height:32px;border-radius:8px;background:#fff}
.stepn{font-size:.8rem;opacity:.85;letter-spacing:.04em;text-transform:uppercase}
.side h1{font-size:1.55rem;line-height:1.25;font-weight:800}
.side p{font-size:.95rem;opacity:.9;line-height:1.45}
.main{display:flex;flex-direction:column;min-height:100vh}
.topr{padding:16px 20px;display:flex;justify-content:flex-end;gap:12px;font-size:.9rem}
.topr a{color:var(--p);text-decoration:none;font-weight:600}
.body{flex:1;padding:12px 22px 24px;max-width:560px}
.foot{padding:14px 20px 22px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;position:sticky;bottom:0;background:#fff}
.prog{flex:1;height:6px;background:#eee;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:10%;background:var(--p);border-radius:99px;transition:width .25s}
.back{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer}
.back svg{width:20px;height:20px}
.cont{margin-left:auto;background:var(--p);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:700;font-size:1rem;cursor:pointer}
.cont:disabled{opacity:.5;cursor:not-allowed}
.f{display:block;font-size:.85rem;font-weight:600;margin:14px 0 6px;color:#374151}
input,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}
textarea{min-height:120px;resize:vertical}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cat{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:.88rem;cursor:pointer}
.cat.on{background:var(--soft);border-color:#c4b5fd;color:var(--pd);font-weight:600}
.err{color:#b91c1c;font-size:.88rem;margin-top:10px;display:none}
.err.show{display:block}
.media-grid{display:flex;gap:8px;overflow-x:auto;margin-top:10px}
.media-grid img,.media-grid video{width:120px;height:80px;object-fit:cover;border-radius:10px;flex-shrink:0}
.acct{max-width:400px}
.acct .note{font-size:.85rem;color:var(--muted);margin-top:10px}
@media(max-width:800px){
  .shell{grid-template-columns:1fr}
  .side{padding:20px 18px 16px}
  .side h1{font-size:1.25rem}
  .body{padding:8px 16px 20px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="/emailjs-config.js"></script>
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="logo" href="/"><img src="/logo-mark.svg" alt=""> HopeForUs</a>
    <div class="stepn" id="stepn">1 of 6</div>
    <h1 id="stitle">Let's begin your fundraising journey</h1>
    <p id="ssub">We're here to guide you every step of the way.</p>
  </aside>
  <section class="main">
    <div class="topr" id="topr"><a href="/login">Sign in</a></div>
    <div class="body" id="body"></div>
    <div class="foot">
      <div class="prog"><i id="prog"></i></div>
      <button type="button" class="back" id="back" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button type="button" class="cont" id="cont">Continue</button>
    </div>
  </section>
</div>
<script src="/supabase.js?v=13"></script>
<script src="/shared-camps.js?v=13"></script>
<script src="/app.js?v=13"></script>
<script src="/start-flow.js?v=13"></script>
</body>
</html>
