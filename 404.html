<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HopeForUs</title>
<style>
body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;color:#1a1a1a;background:#fff}
.box{text-align:center;padding:24px}
a{color:#7C3AED;font-weight:600}
</style>
</head>
<body>
<div class="box" id="msg">Opening…</div>
<script>
(function(){
  var path = (location.pathname || '').replace(/\/+$/, '').replace(/^\//, '');
  var parts = path.split('/').filter(Boolean);
  var first = (parts[0] || '').toLowerCase();
  var second = parts[1] || '';
  var q = location.search || '';
  var h = location.hash || '';

  // Always land on real .html files
  var pages = {
    'admin': '/dashboard/index.html#admin',
    'login': '/login/index.html',
    'dashboard': '/dashboard/index.html',
    'start': '/start/index.html',
    'create': '/start/index.html',
    'signup': '/start/index.html',
    'donate': '/donate/index.html',
    'report': '/report/index.html',
    'review': '/review/index.html',
    'campaign': '/campaign/index.html',
    'f': '/f.html'
  };

  if (pages[first] && !second) {
    location.replace(pages[first] + q + (first === 'admin' ? '' : h));
    return;
  }

  // Short share links: /c/CODE or /f/CODE → f.html resolver
  if ((first === 'c' || first === 'f') && second) {
    location.replace('/f.html?c=' + encodeURIComponent(second.toUpperCase()));
    return;
  }

  // /campaign/SOME-ID → campaign page
  if (first === 'campaign' && second && second !== 'index.html') {
    location.replace('/campaign/index.html?id=' + encodeURIComponent(second) + q.replace(/^\?/, '&').replace(/^&/, '?'));
    return;
  }

  // Bare code: /EEPBA7
  if (parts.length === 1 && first && first !== '404.html' && first.indexOf('.') === -1) {
    location.replace('/f.html?c=' + encodeURIComponent(first.toUpperCase()));
    return;
  }

  document.getElementById('msg').innerHTML = 'Page not found. <a href="/">Go home</a>';
})();
</script>
</body>
</html>
