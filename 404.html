<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HopeForUs</title>
<style>
body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;color:#1a1a1a;background:#fff}
.box{text-align:center;padding:24px}
a{color:#7C3AED;font-weight:600}
</style>
</head>
<body>
<div class="box" id="msg">Opening…</div>
<script>
(function(){
  var path = (location.pathname || '').replace(/\/+$/, '').replace(/^\//, '');
  var parts = path.split('/').filter(Boolean);
  var first = (parts[0] || '').toLowerCase();
  var second = parts[1] || '';

  var pages = {
    'admin': '/dashboard/#admin',
    'login': '/login',
    'dashboard': '/dashboard/',
    'start': '/start',
    'create': '/start',
    'signup': '/signup',
    'donate': '/donate',
    'report': '/report'
  };

  if (pages[first] && !second) {
    location.replace(pages[first] + (location.search || '') + (location.hash || ''));
    return;
  }

  // Short share links: /c/EEPBA7 or /f/EEPBA7 or /campaign/EEPBA7
  if ((first === 'c' || first === 'campaign' || first === 'f') && second) {
    location.replace('/f?c=' + encodeURIComponent(second.toUpperCase()));
    return;
  }

  // Bare code: /EEPBA7
  if (parts.length === 1 && first && first !== '404.html' && first.indexOf('.') === -1) {
    location.replace('/f?c=' + encodeURIComponent(first.toUpperCase()));
    return;
  }

  document.getElementById('msg').innerHTML = 'Page not found. <a href="/">Go home</a>';
})();
</script>
</body>
</html>
