<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard – HopeForUs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#7C3AED;--pd:#4C1D95;--font:Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#fafafa;color:#1a1a1a;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem;border:0;background:none;cursor:pointer;color:inherit}
.logo img{width:28px;height:28px}
.search{height:36px;padding:0 14px;border-radius:999px;border:1px solid #e5e5e5;background:#fff;font-weight:600;cursor:pointer}
.tools{display:flex;align-items:center;gap:8px;position:relative}
.av{width:36px;height:36px;border-radius:50%;border:0;background:var(--pd);color:#E9D5FF;font-weight:800;cursor:pointer}
.menu{position:absolute;right:0;top:44px;background:#fff;border:1px solid #eee;border-radius:12px;min-width:200px;box-shadow:0 12px 40px rgba(0,0,0,.1);padding:8px 0;z-index:30}
.menu.hide{display:none}
.menu button,.menu a{display:block;width:100%;text-align:left;padding:11px 16px;background:none;border:0;color:#1c1c1c;font:inherit;font-size:.95rem;text-decoration:none;cursor:pointer}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 60px)}
aside{background:#fff;border-right:1px solid #eee;padding:16px 10px}
.side{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border:0;border-radius:10px;background:none;color:#444;font:inherit;font-weight:600;cursor:pointer;margin-bottom:4px}
.side.on{background:#EDE9FE;color:var(--pd)}
.side i{width:22px;text-align:center}
main{padding:18px 22px 80px}
.pane h1{font-size:1.4rem;font-weight:800;margin-bottom:4px}
.sub{color:#6b7280;font-size:.92rem;margin-bottom:14px}
.card{background:#fff;border:1px solid #eee;border-radius:14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.stat{background:#fff;border:1px solid #eee;border-radius:12px;padding:12px}
.stat span{display:block;font-size:.75rem;color:#6b7280;font-weight:600}
.stat b{font-size:1.15rem}
.donor{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f3f3f3}
.donor:last-child{border:0}
.dot{width:36px;height:36px;border-radius:50%;background:#EDE9FE;color:var(--pd);display:flex;align-items:center;justify-content:center;font-weight:800}
.note{font-size:.82rem;color:#6b7280}
.btn,.mini-btn{height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--pd);color:#E9D5FF;font-weight:800;cursor:pointer;font:inherit}
.mini-btn{height:34px;font-size:.85rem}
.mini-btn.bad,.btn.bad{background:#b91c1c;color:#fff}
.approve-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:12px}
.approve-row{display:flex;align-items:center;gap:8px}
label{display:block;font-size:.8rem;font-weight:600;color:#5c5c5c;margin:10px 0 6px}
input,select,textarea{width:100%;border:1.5px solid #e5e5e5;border-radius:12px;padding:11px 12px;font:inherit}
.mob{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;z-index:40}
.mob button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:#6b6b6b;font-size:11px;font-weight:700;padding:8px 0 6px;cursor:pointer;flex:1}
.mob button.on{color:#4C1D95}
.mob button span{font-size:1.25rem;line-height:1;display:block}
@media(max-width:800px){
  .layout{grid-template-columns:1fr}
  aside{display:none}
  .mob{display:flex}
  main{padding-bottom:90px}
}
</style>
</head>
<body>
<header>
  <button class="search" id="searchBtn" type="button">Search</button>
  <button class="logo" id="homeBtn" type="button"><img src="/logo-mark.svg" alt=""> HopeForUs</button>
  <div class="tools">
    <button class="av" id="avBtn" type="button">J</button>
    <div class="menu hide" id="menu">
      <button type="button" data-tab="donations">Donations Received</button>
      <button type="button" data-tab="updates">Updates</button>
      <button type="button" data-tab="settings">Account settings</button>
      <button type="button" data-tab="admin" id="adminMenu" class="hide">Approve</button>
      <button type="button" data-tab="reports" id="reportsMenu" class="hide">Reports</button>
      <a href="/start">Start a new fundraiser</a>
      <button type="button" id="lo">Sign out</button>
    </div>
  </div>
</header>
<div class="layout">
  <aside>
    <button class="side on" data-tab="home" type="button"><i>⌂</i> Dashboard</button>
    <button class="side" data-tab="donations" type="button"><i>♡</i> Donations</button>
    <button class="side" data-tab="transfers" type="button"><i>$</i> Transfers</button>
    <button class="side" data-tab="updates" type="button"><i>✎</i> Updates</button>
    <button class="side hide" id="adminNav" data-tab="admin" type="button"><i>✓</i> Approve</button>
    <button class="side hide" id="reportsNav" data-tab="reports" type="button"><i>⚑</i> Reports</button>
    <button class="side hide" id="usersNav" data-tab="users" type="button"><i>👤</i> Users</button>
  </aside>
  <main id="main"></main>
</div>
<nav class="mob">
  <button type="button" data-tab="home" class="on"><span>⌂</span>Home</button>
  <button type="button" data-tab="donations"><span>♡</span>Donations</button>
  <button type="button" data-tab="transfers"><span>$</span>Transfers</button>
  <button type="button" data-tab="updates"><span>☰</span>Updates</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="/emailjs-config.js?v=37"></script>
<script src="/supabase.js?v=37"></script>
<script src="/supabase-reports-patch.js?v=37"></script>
<script src="/shared-camps.js?v=35"></script>
<script src="/campaigns-data.js?v=35"></script>
<script src="/app.js?v=37"></script>
<script src="/app-reports-patch.js?v=37"></script>
<script src="/auth-store.js?v=36"></script>
<script src="/login-core-patch.js?v=36"></script>
<script src="/dashboard/dash.js?v=37"></script>
<script src="/dashboard/dash-reports-patch.js?v=37"></script>
<script src="/dashboard/dash-approve-patch.js?v=35"></script>
<script src="/dashboard/dash-users-sync.js?v=35"></script>
</body>
</html>
